<script>
const questions = [{"id":126,"question":"Chỉ ra phát biểu nào là Sai khi nói về hệ kín?","type":"mc","explanation":"Câu này cần xem xét: theo cơ học, hệ kín thường được hiểu là hệ có hợp lực ngoại lực bằng 0 (hoặc ngoại lực có thể bỏ qua), còn nội lực không nhất thiết “cân bằng với ngoại lực”. Mệnh đề B vì vậy sai. Tuy nhiên, mệnh đề D nói năng lượng không truyền ra ngoài là thuộc tính của hệ cô lập theo cách phân loại nhiệt động học, không phải định nghĩa chung của hệ kín. Do cách dùng thuật ngữ không nhất quán, câu có thể có hơn một phát biểu sai và không được tính điểm tự động.","status":"review","note":"Thuật ngữ “hệ kín” chưa nhất quán; có thể có nhiều phát biểu sai.","options":["Là hệ mà trong đó chỉ có nội lực của các vật của hệ tác dụng lẫn nhau.","Là hệ mà nội lực và ngoại lực cân bằng nhau.","Là một hệ không chịu tác dụng của ngoại lực hoặc ngoại lực triệt tiêu lẫn nhau.","Là hệ vật mà năng lượng của hệ không thể truyền ra khỏi ranh giới của hệ."]},{"id":127,"question":"Chỉ ra khái niệm Đúng về hệ không kín?","type":"mc","explanation":"Hệ không kín có thể trao đổi năng lượng qua ranh giới hệ (và trong một số định nghĩa còn có thể trao đổi vật chất). Vì vậy chọn phát biểu C.","status":"verified","options":["Là hệ mà tổng năng lượng của hệ có thể không đổi.","Là hệ không chịu tác dụng của lực nào cả.","Là hệ vật mà năng lượng của hệ có thể truyền qua ranh giới của hệ.","Hệ chịu tác dụng của các ngoại lực cân bằng."],"answer":2},{"id":128,"question":"Chỉ ra phát biểu nào là Sai khi nói về công?","type":"mc","explanation":"Công là đại lượng vô hướng, có thể dương, âm hoặc bằng 0 và là một cách truyền năng lượng. Với lực không đổi, công còn phụ thuộc góc giữa lực và độ dời: \\(A=Fs\\cos\\theta\\), không chỉ phụ thuộc độ lớn lực và quãng dịch chuyển. Chọn C.","status":"verified","options":["Công là một đại lượng vô hướng.","Công có thể âm hoặc dương.","Công chỉ phụ thuộc vào độ lớn của lực và chiều dài độ dịch chuyển điểm đặt của lực.","Công là phần năng lượng trao đổi."],"answer":2},{"id":129,"question":"Chỉ ra đại lượng có thể không có khi một vật đang chuyển động?","type":"mc","explanation":"Vật đang chuyển động có tốc độ khác 0 nên động năng và độ lớn động lượng khác 0. Thế năng có thể bằng 0 tùy vị trí được chọn làm mốc thế năng. Chọn A.","status":"verified","options":["Thế năng.","Động năng.","Cơ năng.","Động lượng."],"answer":0},{"id":130,"question":"Một vật được ném từ dưới đất lên cao. Chỉ ra lựa chọn chính xác về sự thay đổi của động năng, thế năng và công của trọng lực trong quá trình chuyển động của vật?","type":"mc","explanation":"Khi vật đi lên, độ cao tăng nên thế năng hấp dẫn tăng. Trọng lực hướng xuống, ngược hướng độ dời nên công của trọng lực âm; đồng thời động năng giảm. Trong các lựa chọn, D là phát biểu đúng.","status":"verified","options":["Động năng của vật tăng, trọng lực sinh công dương.","Thế năng của vật giảm, trọng lực sinh công âm.","Động năng của vật giảm, trọng lực sinh công dương.","Thế năng của vật tăng, trọng lực sinh công âm."],"answer":3},{"id":131,"question":"Chỉ ra phát biểu Sai về đặc điểm của công các lực thế?","type":"mc","explanation":"Lực thế (lực bảo toàn) có công không phụ thuộc dạng đường đi mà chỉ phụ thuộc trạng thái đầu và cuối. Công của lực đàn hồi cũng không phụ thuộc dạng đường đi; vì thế mệnh đề C là sai. Công của lực ma sát phụ thuộc đường đi là đúng.","status":"verified","options":["Công của lực ma sát phụ thuộc dạng đường đi của vật.","Công của trọng lực có thể dương, âm, hoặc bằng 0.","Công của lực đàn hồi phụ thuộc dạng đường đi của vật chịu lực.","Công của trọng lực không phụ thuộc dạng đường đi của vật."],"answer":2},{"id":132,"question":"Nhận biết nội dung định lý động năng?","type":"mc","explanation":"Định lý động năng: công của hợp lực (tổng công của các lực tác dụng) bằng độ biến thiên động năng, \\(A_{\\text{hợp}}=\\Delta K\\). Chọn B.","status":"verified","options":["Độ biến thiên động lượng của một chất điểm bằng xung lượng của hợp lực tác dụng lên chất điểm.","Khi công của tổng ngoại lực thực hiện trên một hệ chỉ làm thay đổi vận tốc của hệ, thì tổng công toàn phần thực hiện trên hệ bằng độ biến thiên động năng của hệ.","Cơ năng của hệ chỉ chịu tác dụng của lực thế được bảo toàn.","Công của lực phi thế làm biến đổi cơ năng của hệ."],"answer":1},{"id":133,"question":"Nhận biết nội dung định luật bảo toàn cơ năng là?","type":"mc","explanation":"Khi hệ chỉ chịu tác dụng của các lực thế (hoặc công của lực không bảo toàn bằng 0), tổng cơ năng \\(E=K+U\\) được bảo toàn. Chọn D.","status":"verified","options":["Độ biến thiên động lượng của một chất điểm bằng xung lượng của hợp lực tác dụng lên chất điểm.","Khi công của tổng ngoại lực thực hiện trên một hệ chỉ làm thay đổi vận tốc của hệ, thì tổng công toàn phần thực hiện trên hệ bằng độ biến thiên động năng của hệ.","Công của lực phi thế làm biến đổi cơ năng của hệ.","Cơ năng của hệ chỉ chịu tác dụng của lực thế được bảo toàn."],"answer":3},{"id":134,"question":"Một vật khối lượng m trượt trên mặt phẳng nghiêng có góc hợp với mặt phẳng ngang là \\(\\alpha\\), vật dịch chuyển đoạn s. Chỉ ra công thức công của lực ma sát tác dụng lên vật?","type":"manual","explanation":"Lực ma sát trượt có độ lớn \\(F_{ms}=\\mu N\\). Với vật chỉ chịu trọng lực và phản lực theo phương vuông góc mặt phẳng, \\(N=mg\\cos\\alpha\\). Ma sát ngược hướng chuyển động nên \\(A_{ms}=-F_{ms}s=-\\mu mg\\cos\\alpha\\,s\\). Nếu tài liệu dùng ký hiệu k cho hệ số ma sát thì thay \\(\\mu\\) bằng k. Đề không in hệ số ma sát cụ thể; đây là công thức tổng quát, không có phương án gốc.","status":"verified"},{"id":135,"question":"Một vật khối lượng m trượt trên mặt phẳng nghiêng có góc hợp với mặt phẳng ngang là \\(\\alpha\\), vật dịch chuyển từ đỉnh dốc xuống chân dốc chiều dài s. Chỉ ra công thức công của trọng lực tác dụng lên vật?","type":"manual","explanation":"Độ giảm độ cao là \\(h=s\\sin\\alpha\\). Công của trọng lực khi vật trượt xuống là \\(A_P=mgh=mg s\\sin\\alpha\\), dương vì trọng lực cùng chiều thành phần độ dời. Câu gốc không có các phương án lựa chọn.","status":"verified"},{"id":136,"question":"Chỉ ra đại lượng nào sau đây không phụ thuộc vào hướng véc tơ vận tốc của vật?","type":"mc","explanation":"Động năng \\(K=\\tfrac12 mv^2\\) chỉ phụ thuộc khối lượng và độ lớn vận tốc, không phụ thuộc hướng của vectơ vận tốc. Động lượng và xung lượng là vectơ. Chọn A.","status":"verified","options":["Động năng.","Động lượng.","Gia tốc.","Xung lượng."],"answer":0},{"id":137,"question":"Một người chèo thuyền ngược dòng sông. Nước chảy xiết nên thuyền không tiến lên được so với bờ. Chỉ ra giá trị công mà người chèo thuyền thực hiện được? Nêu lí do vì sao?","type":"manual","explanation":"Xét công cơ học của lực người chèo tác dụng lên thuyền đối với mặt đất: \\(A=\\vec F\\cdot\\vec s\\). Vì thuyền không dịch chuyển so với bờ nên \\(s=0\\), do đó công cơ học lên thuyền bằng \\(A=0\\). Người chèo vẫn tiêu hao năng lượng sinh học; điều đó không đồng nghĩa với công cơ học lên thuyền khác 0. Câu gốc không đưa ra phương án.","status":"verified"},{"id":138,"question":"Chỉ ra phát biểu Sai khi nói về thế năng của một vật?","type":"mc","explanation":"Thế năng tại một vị trí không phụ thuộc vận tốc tại vị trí đó; thế năng hấp dẫn phụ thuộc vị trí và mốc chọn, còn thế năng đàn hồi phụ thuộc biến dạng. Chọn C.","status":"verified","options":["Thế năng hấp dẫn và thế năng đàn hồi là hai trong số các dạng thế năng.","Thế năng có giá trị phụ thuộc vào chọn mốc thế năng.","Thế năng của một vật tại một vị trí phụ thuộc vào vận tốc của vật tại vị trí đó.","Thế năng hấp dẫn của vật chính là thế năng của hệ kín gồm vật và Trái đất."],"answer":2},{"id":139,"question":"Chỉ ra đại lượng mà thế năng đàn hồi của lò xo không phụ thuộc vào?","type":"mc","explanation":"Với mốc thế năng tại vị trí lò xo không biến dạng, \\(U_{dh}=\\tfrac12 kx^2\\). Biểu thức phụ thuộc k và bình phương độ biến dạng, không phụ thuộc chiều biến dạng (nén hay dãn). Chọn C.","status":"verified","options":["Độ cứng của lò xo.","Độ biến dạng của lò xo.","Chiều biến dạng của lò xo.","Mốc thế năng."],"answer":2},{"id":140,"question":"Liệt kê giá trị thế năng hấp dẫn có thể đạt được?","type":"mc","explanation":"Thế năng là đại lượng vô hướng. Giá trị có thể dương, âm hoặc bằng 0 tùy mốc thế năng được chọn. Chọn A.","status":"verified","options":["Vô hướng, có thể âm, dương hoặc bằng 0.","Vô hướng, dương hoặc bằng 0.","Vecto có độ lớn luôn dương hoặc bằng 0.","Vecto cùng hướng với trọng lực."],"answer":0},{"id":141,"question":"Một viên đạn được bắn từ mặt đất lên cao hợp với phương ngang một góc α, với vận tốc ban đầu v₁, bỏ qua sức cản không khí. Chỉ ra đại lượng không đổi khi viên đạn đang bay là?","type":"mc","explanation":"Bỏ qua sức cản không khí thì chỉ có trọng lực (lực thế) thực hiện công. Động năng và thế năng biến đổi qua lại nhưng tổng cơ năng \\(K+U\\) không đổi. Chọn A.","status":"verified","options":["Cơ năng.","Động năng.","Thế năng.","Động lượng."],"answer":0},{"id":142,"question":"Chỉ ra phương của lực tác dụng lên một vật đang chuyển động thẳng biến đổi đều không thực hiện công khi nào?","type":"manual","explanation":"Công của lực \\(A=Fs\\cos\\theta\\). Công bằng 0 khi lực vuông góc với độ dời (\\(\\theta=90^\\circ\\)); trong chuyển động thẳng, điều này nghĩa là lực vuông góc với phương chuyển động. Câu gốc không cung cấp các phương án.","status":"verified"},{"id":143,"question":"Chỉ ra giá trị của động lượng và động năng thay đổi như thế nào nếu khối lượng vật tăng gấp 2 lần, vận tốc vật giảm đi một nửa?","type":"manual","explanation":"Động lượng mới: \\(p'=m'v'=(2m)(v/2)=mv=p\\), nên độ lớn động lượng không đổi (nếu hướng vận tốc giữ nguyên thì vectơ động lượng cũng không đổi). Động năng mới: \\(K'=\\tfrac12(2m)(v/2)^2=\\tfrac12K\\), tức giảm còn một nửa. Không có phương án trong tài liệu.","status":"verified"},{"id":144,"question":"Hai vật có cùng khối lượng, chuyển động cùng tốc độ nhưng một vật theo phương ngang và một vật phương thẳng đứng. Chỉ ra đặc điểm đúng của động năng và động lượng hai vật sẽ có?","type":"mc","explanation":"Hai vật có cùng m và cùng tốc độ nên động năng \\(K=\\tfrac12 mv^2\\) bằng nhau. Vectơ động lượng \\(\\vec p=m\\vec v\\) khác hướng do vận tốc khác hướng. Chọn C.","status":"verified","options":["Hai vật có cùng động lượng và cùng động năng.","Hai vật có động lượng và động năng đều không giống nhau.","Hai vật có cùng động năng nhưng động lượng khác nhau.","Hai vật có cùng động lượng nhưng động năng khác nhau."],"answer":2},{"id":145,"question":"Chỉ ra đặc điểm nào sau đây là Sai khi nói về công của trọng lực?","type":"mc","explanation":"Trọng lực là lực thế, nên công của trọng lực chỉ phụ thuộc độ cao điểm đầu và điểm cuối (và khối lượng), không phụ thuộc dạng đường đi. Do đó phát biểu A là sai.","status":"verified","options":["Công của trọng lực phụ thuộc vào dạng đường đi.","Công của trọng lực phụ thuộc vào độ cao ban đầu của vật.","Công của trọng lực phụ thuộc vào khối lượng của vật.","Công của trọng lực phụ thuộc vào độ cao điểm đầu và điểm cuối của vật."],"answer":0},{"id":146,"question":"Vật có khối lượng m được thả từ A và trượt không ma sát từ đỉnh mặt phẳng nghiêng có độ cao h=8 m xuống chân mặt phẳng nghiêng. Xác định độ lớn vận tốc của vật tại chân mặt phẳng nghiêng?","type":"num","explanation":"Bảo toàn cơ năng, vật được thả nghỉ: \\(mgh=\\tfrac12 mv^2\\), nên \\(v=\\sqrt{2gh}\\). Thay \\(h=8\\,\\text{m}\\), nếu lấy \\(g=9{,}8\\,\\text{m/s}^2\\) (đề không nêu g) thì \\(v=\\sqrt{2\\cdot9{,}8\\cdot8}\\approx12{,}52\\,\\text{m/s}\\).","status":"conditional","expected":12.521980673998822,"unit":"m/s","diagram":"<svg xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Vật trượt không ma sát từ độ cao 8 m\" viewBox=\"0 0 520 230\" width=\"520\" height=\"230\" style=\"max-width:100%;height:auto;display:block\"><defs><marker id=\"arr\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L6,3 L0,6 Z\" fill=\"#2563eb\"/></marker><marker id=\"arrRed\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L6,3 L0,6 Z\" fill=\"#dc2626\"/></marker><marker id=\"arrGreen\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L6,3 L0,6 Z\" fill=\"#059669\"/></marker><marker id=\"arrOrange\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L6,3 L0,6 Z\" fill=\"#d97706\"/></marker></defs><path d=\"M85 188 L420 188 L85 38 Z\" fill=\"#e8eef7\" stroke=\"#475569\" stroke-width=\"2\"/><rect x=\"208\" y=\"94\" width=\"56\" height=\"30\" rx=\"5\" fill=\"#60a5fa\" stroke=\"#1d4ed8\" transform=\"rotate(24 236 109)\"/><line x1=\"70\" y1=\"38\" x2=\"70\" y2=\"188\" stroke=\"#0f766e\" stroke-width=\"2\"/><path d=\"M64 45 L70 35 L76 45 M64 181 L70 191 L76 181\" fill=\"none\" stroke=\"#0f766e\" stroke-width=\"2\"/><text x=\"23\" y=\"112\" font-size=\"16\" fill=\"#0f766e\" font-weight=\"700\">h = 8 m</text><text x=\"173\" y=\"207\" font-size=\"14\" fill=\"#475569\">Mặt phẳng nghiêng, không ma sát</text><text x=\"265\" y=\"82\" font-size=\"15\" fill=\"#1d4ed8\">m</text><text x=\"98\" y=\"175\" font-size=\"13\" fill=\"#475569\">Minh họa, không theo tỉ lệ</text></svg>"},{"id":147,"question":"Vật m=1,5 kg trượt trên mặt phẳng ngang với hệ số ma sát k=0,1. Vật đi từ A đến B dài 10 m. Xác định công của lực ma sát?","type":"num","explanation":"Trên mặt phẳng ngang, \\(N=mg\\) nên \\(F_{ms}=kmg\\). Công của ma sát ngược chiều chuyển động: \\(A_{ms}=-F_{ms}s=-kmg s\\). Dùng \\(g=9{,}8\\,\\text{m/s}^2\\) vì đề không nêu g: \\(A_{ms}=-0{,}1\\cdot1{,}5\\cdot9{,}8\\cdot10=-14{,}7\\,\\text{J}\\).","status":"conditional","expected":-14.7,"unit":"J"},{"id":148,"question":"Một chiếc xe khối lượng m có động cơ có công suất P. Xác định công thức thời gian ngắn nhất để xe tăng tốc từ đứng yên đến vận tốc v?","type":"manual","explanation":"Giả sử công suất cơ học P không đổi và bỏ qua lực cản, công của động cơ bằng độ tăng động năng: \\(Pt=\\Delta K=\\tfrac12 mv^2-0\\). Vì vậy thời gian nhỏ nhất theo mô hình này là \\(t_{min}=\\frac{mv^2}{2P}\\). Nếu P không phải công suất không đổi hoặc có lực cản thì đề cần thêm giả thiết.","status":"verified"},{"id":149,"question":"Một máy bay vận tải đang bay với vận tốc 180 km/h thì ném ra phía sau một thùng hàng khối lượng 20 kg với vận tốc 5 m/s đối với máy bay. Xác định độ lớn động năng của thùng hàng ngay khi ném đối với người đứng trên mặt đất?","type":"num","explanation":"Đổi vận tốc máy bay: \\(180\\,\\text{km/h}=50\\,\\text{m/s}\\). Thùng hàng được ném ngược chiều bay với tốc độ 5 m/s so với máy bay nên (cùng phương) tốc độ so với mặt đất ngay sau khi ném là \\(v=50-5=45\\,\\text{m/s}\\). Động năng: \\(K=\\tfrac12 mv^2=\\tfrac12\\cdot20\\cdot45^2=20250\\,\\text{J}\\).","status":"verified","expected":20250,"unit":"J","diagram":"<svg xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Thùng hàng được ném ra phía sau máy bay\" viewBox=\"0 0 520 230\" width=\"520\" height=\"230\" style=\"max-width:100%;height:auto;display:block\"><defs><marker id=\"arr\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L6,3 L0,6 Z\" fill=\"#2563eb\"/></marker><marker id=\"arrRed\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L6,3 L0,6 Z\" fill=\"#dc2626\"/></marker><marker id=\"arrGreen\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L6,3 L0,6 Z\" fill=\"#059669\"/></marker><marker id=\"arrOrange\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L6,3 L0,6 Z\" fill=\"#d97706\"/></marker></defs><rect x=\"75\" y=\"63\" width=\"270\" height=\"105\" rx=\"12\" fill=\"#dbeafe\" stroke=\"#2563eb\" stroke-width=\"2\"/><rect x=\"95\" y=\"82\" width=\"70\" height=\"48\" rx=\"5\" fill=\"#93c5fd\" stroke=\"#2563eb\"/><text x=\"130\" y=\"111\" text-anchor=\"middle\" font-size=\"15\" fill=\"#1e3a8a\">Hàng</text><line x1=\"180\" y1=\"113\" x2=\"315\" y2=\"113\" stroke=\"#059669\" stroke-width=\"4\" marker-end=\"url(#arrGreen)\"/><text x=\"244\" y=\"99\" text-anchor=\"middle\" font-size=\"15\" fill=\"#059669\">v máy bay 50 m/s</text><line x1=\"180\" y1=\"142\" x2=\"108\" y2=\"142\" stroke=\"#dc2626\" stroke-width=\"3\" marker-end=\"url(#arrRed)\"/><text x=\"180\" y=\"157\" font-size=\"13\" fill=\"#dc2626\">ném ra sau 5 m/s</text><text x=\"75\" y=\"198\" font-size=\"13\" fill=\"#64748b\">Xét vận tốc theo mặt đất; minh họa, không theo tỉ lệ</text></svg>"},{"id":150,"question":"Một viên đạn khối lượng m=100 g đang bay ngang với vận tốc 25 m/s thì xuyên vào một tấm ván mỏng dày 5 cm theo phương vuông góc với tấm ván. Ngay sau khi ra khỏi tấm ván vận tốc của viên đạn bằng 15 m/s. Xác định độ lớn của lực cản trung bình tấm ván tác dụng lên viên đạn?","type":"num","explanation":"Theo định lý động năng, công lực cản bằng độ giảm động năng: \\(F_{tb}d=\\tfrac12 m(v_1^2-v_2^2)\\). Đổi \\(m=0{,}1\\,\\text{kg}\\), \\(d=0{,}05\\,\\text{m}\\). Suy ra \\(F_{tb}=\\frac{0{,}5\\cdot0{,}1(25^2-15^2)}{0{,}05}=400\\,\\text{N}\\).","status":"verified","expected":400,"unit":"N","diagram":"<svg xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Viên đạn xuyên qua tấm ván dày 5 cm\" viewBox=\"0 0 520 230\" width=\"520\" height=\"230\" style=\"max-width:100%;height:auto;display:block\"><defs><marker id=\"arr\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L6,3 L0,6 Z\" fill=\"#2563eb\"/></marker><marker id=\"arrRed\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L6,3 L0,6 Z\" fill=\"#dc2626\"/></marker><marker id=\"arrGreen\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L6,3 L0,6 Z\" fill=\"#059669\"/></marker><marker id=\"arrOrange\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L6,3 L0,6 Z\" fill=\"#d97706\"/></marker></defs><rect x=\"235\" y=\"35\" width=\"52\" height=\"170\" rx=\"3\" fill=\"#d1d5db\" stroke=\"#475569\" stroke-width=\"2\"/><text x=\"261\" y=\"22\" font-size=\"15\" text-anchor=\"middle\" fill=\"#475569\">Tấm ván</text><line x1=\"38\" y1=\"89\" x2=\"215\" y2=\"89\" stroke=\"#2563eb\" stroke-width=\"4\" marker-end=\"url(#arr)\"/><text x=\"45\" y=\"71\" font-size=\"16\" fill=\"#2563eb\">v₁ = 25 m/s</text><line x1=\"305\" y1=\"145\" x2=\"476\" y2=\"145\" stroke=\"#059669\" stroke-width=\"4\" marker-end=\"url(#arrGreen)\"/><text x=\"320\" y=\"128\" font-size=\"16\" fill=\"#059669\">v₂ = 15 m/s</text><line x1=\"235\" y1=\"213\" x2=\"287\" y2=\"213\" stroke=\"#dc2626\" stroke-width=\"2\"/><text x=\"261\" y=\"229\" font-size=\"14\" text-anchor=\"middle\" fill=\"#dc2626\">d = 5 cm</text></svg>"},{"id":151,"question":"Xác định thời gian bao lâu sau khi bắt đầu rơi tự do một vật có khối lượng 100 g có động năng bằng 1,5 J? Lấy g=10 m/s².","type":"num","explanation":"Vật thả nghỉ nên \\(v=gt\\). Động năng \\(K=\\tfrac12 mv^2=\\tfrac12 mg^2t^2\\). Do đó \\(t=\\sqrt{2K/(mg^2)}=\\sqrt{3/(0{,}1\\cdot100)}=\\sqrt{0{,}3}\\approx0{,}548\\,\\text{s}\\).","status":"verified","expected":0.5477225575051661,"unit":"s"},{"id":152,"question":"Một buồng cáp treo chở người có khối lượng tổng cộng 800 kg đi từ vị trí xuất phát cách mặt đất 10 m tới một trạm dừng trên núi ở độ cao 550 m sau đó lại tiếp tục tới một trạm khác cao hơn. Lấy g=10 m/s². Xác định giá trị công do trọng lực thực hiện khi buồng cáp treo di chuyển từ vị trí xuất phát tới trạm dừng thứ nhất?","type":"num","explanation":"Công của trọng lực chỉ phụ thuộc độ chênh cao: \\(A_P=mg(h_i-h_f)\\). Với \\(h_i=10\\,\\text{m}\\), \\(h_f=550\\,\\text{m}\\): \\(A_P=800\\cdot10\\cdot(10-550)=-4{,}32\\times10^6\\,\\text{J}\\). Dấu âm vì cabin đi lên.","status":"verified","expected":-4320000,"unit":"J"},{"id":153,"question":"Một người thực hiện một công đạp xe đạp lên đoạn đường dài 30 m trên một dốc nghiêng 30° so với phương ngang. Bỏ qua mọi ma sát. Xác định quãng đường người đó đi được nếu thực hiện một công cũng như vậy mà lên dốc nghiêng 20° so với phương ngang?","type":"num","explanation":"Bỏ qua ma sát, công để lên dốc là \\(A=mgs\\sin\\theta\\). Công như nhau (cùng người và g) nên \\(30\\sin30^\\circ=s_2\\sin20^\\circ\\). Vì vậy \\(s_2=\\frac{30\\sin30^\\circ}{\\sin20^\\circ}\\approx43{,}86\\,\\text{m}\\).","status":"verified","expected":43.85706600244631,"unit":"m"},{"id":154,"question":"Xác định công thức tính công của lực ma sát khi vật đặt trên mặt phẳng ngang có hệ số ma sát k, chịu tác dụng lực F hướng lên hợp với phương ngang góc θ?","type":"manual","explanation":"Theo phương thẳng đứng, \\(N+F\\sin\\theta-mg=0\\), nên \\(N=mg-F\\sin\\theta\\) (điều kiện vật vẫn tiếp xúc mặt phẳng). Ma sát trượt có độ lớn \\(F_{ms}=kN\\), hướng ngược độ dời. Nếu vật dịch chuyển ngang quãng s thì \\(A_{ms}=-k(mg-F\\sin\\theta)s\\).","status":"verified","diagram":"<svg xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Vật trên mặt phẳng ngang chịu lực kéo chếch lên\" viewBox=\"0 0 520 230\" width=\"520\" height=\"230\" style=\"max-width:100%;height:auto;display:block\"><defs><marker id=\"arr\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L6,3 L0,6 Z\" fill=\"#2563eb\"/></marker><marker id=\"arrRed\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L6,3 L0,6 Z\" fill=\"#dc2626\"/></marker><marker id=\"arrGreen\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L6,3 L0,6 Z\" fill=\"#059669\"/></marker><marker id=\"arrOrange\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L6,3 L0,6 Z\" fill=\"#d97706\"/></marker></defs><line x1=\"35\" y1=\"180\" x2=\"485\" y2=\"180\" stroke=\"#64748b\" stroke-width=\"3\"/><rect x=\"197\" y=\"96\" width=\"104\" height=\"84\" rx=\"5\" fill=\"#bfdbfe\" stroke=\"#2563eb\" stroke-width=\"2\"/><text x=\"249\" y=\"143\" font-size=\"20\" text-anchor=\"middle\" fill=\"#1e3a8a\" font-weight=\"700\">m</text><line x1=\"249\" y1=\"96\" x2=\"249\" y2=\"28\" stroke=\"#2563eb\" stroke-width=\"4\" marker-end=\"url(#arr)\"/><text x=\"261\" y=\"43\" font-size=\"17\" fill=\"#2563eb\">N</text><line x1=\"249\" y1=\"180\" x2=\"249\" y2=\"224\" stroke=\"#2563eb\" stroke-width=\"4\" marker-end=\"url(#arr)\"/><text x=\"261\" y=\"218\" font-size=\"17\" fill=\"#2563eb\">P = mg</text><line x1=\"197\" y1=\"138\" x2=\"112\" y2=\"138\" stroke=\"#dc2626\" stroke-width=\"4\" marker-end=\"url(#arrRed)\"/><text x=\"60\" y=\"123\" font-size=\"15\" fill=\"#dc2626\">Fms</text><line x1=\"301\" y1=\"130\" x2=\"410\" y2=\"69\" stroke=\"#059669\" stroke-width=\"4\" marker-end=\"url(#arrGreen)\"/><text x=\"376\" y=\"53\" font-size=\"18\" fill=\"#059669\">F</text><line x1=\"315\" y1=\"130\" x2=\"410\" y2=\"130\" stroke=\"#94a3b8\" stroke-dasharray=\"5 5\"/><path d=\"M350 130 A35 35 0 0 0 345 113\" fill=\"none\" stroke=\"#64748b\" stroke-width=\"2\"/><text x=\"355\" y=\"112\" font-size=\"16\" fill=\"#475569\">θ</text><text x=\"25\" y=\"218\" font-size=\"13\" fill=\"#64748b\">Lực kéo hướng lên so với phương ngang</text></svg>"},{"id":155,"question":"Xác định công thức tính công của lực ma sát khi vật đặt trên mặt phẳng ngang có hệ số ma sát k, chịu tác dụng lực F hướng xuống hợp với phương ngang góc θ?","type":"manual","explanation":"Lực F có thành phần thẳng đứng hướng xuống nên \\(N=mg+F\\sin\\theta\\). Vì lực ma sát ngược chiều độ dời ngang s, \\(A_{ms}=-F_{ms}s=-k(mg+F\\sin\\theta)s\\).","status":"verified","diagram":"<svg xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Vật trên mặt phẳng ngang chịu lực kéo chếch xuống\" viewBox=\"0 0 520 230\" width=\"520\" height=\"230\" style=\"max-width:100%;height:auto;display:block\"><defs><marker id=\"arr\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L6,3 L0,6 Z\" fill=\"#2563eb\"/></marker><marker id=\"arrRed\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L6,3 L0,6 Z\" fill=\"#dc2626\"/></marker><marker id=\"arrGreen\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L6,3 L0,6 Z\" fill=\"#059669\"/></marker><marker id=\"arrOrange\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L6,3 L0,6 Z\" fill=\"#d97706\"/></marker></defs><line x1=\"35\" y1=\"180\" x2=\"485\" y2=\"180\" stroke=\"#64748b\" stroke-width=\"3\"/><rect x=\"197\" y=\"96\" width=\"104\" height=\"84\" rx=\"5\" fill=\"#bfdbfe\" stroke=\"#2563eb\" stroke-width=\"2\"/><text x=\"249\" y=\"143\" font-size=\"20\" text-anchor=\"middle\" fill=\"#1e3a8a\" font-weight=\"700\">m</text><line x1=\"249\" y1=\"96\" x2=\"249\" y2=\"28\" stroke=\"#2563eb\" stroke-width=\"4\" marker-end=\"url(#arr)\"/><text x=\"261\" y=\"43\" font-size=\"17\" fill=\"#2563eb\">N</text><line x1=\"249\" y1=\"180\" x2=\"249\" y2=\"224\" stroke=\"#2563eb\" stroke-width=\"4\" marker-end=\"url(#arr)\"/><text x=\"261\" y=\"218\" font-size=\"17\" fill=\"#2563eb\">P = mg</text><line x1=\"197\" y1=\"138\" x2=\"112\" y2=\"138\" stroke=\"#dc2626\" stroke-width=\"4\" marker-end=\"url(#arrRed)\"/><text x=\"60\" y=\"123\" font-size=\"15\" fill=\"#dc2626\">Fms</text><line x1=\"301\" y1=\"130\" x2=\"410\" y2=\"192\" stroke=\"#059669\" stroke-width=\"4\" marker-end=\"url(#arrGreen)\"/><text x=\"413\" y=\"202\" font-size=\"18\" fill=\"#059669\">F</text><line x1=\"315\" y1=\"130\" x2=\"410\" y2=\"130\" stroke=\"#94a3b8\" stroke-dasharray=\"5 5\"/><path d=\"M350 130 A35 35 0 0 1 345 147\" fill=\"none\" stroke=\"#64748b\" stroke-width=\"2\"/><text x=\"355\" y=\"154\" font-size=\"16\" fill=\"#475569\">θ</text><text x=\"25\" y=\"218\" font-size=\"13\" fill=\"#64748b\">Lực kéo hướng xuống so với phương ngang</text></svg>"},{"id":156,"question":"Xác định công thức tính công của lực ma sát khi vật trượt xuống trên mặt phẳng nghiêng có hệ số ma sát k, mặt phẳng nghiêng lên hợp với phương ngang góc θ?","type":"manual","explanation":"Lực pháp tuyến \\(N=mg\\cos\\theta\\); ma sát trượt có độ lớn \\(F_{ms}=kmg\\cos\\theta\\). Vật trượt xuống nên ma sát hướng lên dốc, ngược độ dời. Với chiều dài dốc s, \\(A_{ms}=-kmg\\cos\\theta\\,s\\).","status":"verified","diagram":"<svg xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Vật trượt xuống mặt phẳng nghiêng chịu ma sát\" viewBox=\"0 0 520 230\" width=\"520\" height=\"230\" style=\"max-width:100%;height:auto;display:block\"><defs><marker id=\"arr\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L6,3 L0,6 Z\" fill=\"#2563eb\"/></marker><marker id=\"arrRed\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L6,3 L0,6 Z\" fill=\"#dc2626\"/></marker><marker id=\"arrGreen\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L6,3 L0,6 Z\" fill=\"#059669\"/></marker><marker id=\"arrOrange\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L6,3 L0,6 Z\" fill=\"#d97706\"/></marker></defs><path d=\"M55 32 L55 199 L448 199 Z\" fill=\"#f1f5f9\" stroke=\"#475569\" stroke-width=\"3\"/><g transform=\"translate(230 125) rotate(34)\"><rect x=\"-35\" y=\"-24\" width=\"70\" height=\"48\" rx=\"4\" fill=\"#bfdbfe\" stroke=\"#2563eb\" stroke-width=\"2\"/></g><line x1=\"230\" y1=\"125\" x2=\"164\" y2=\"75\" stroke=\"#dc2626\" stroke-width=\"3.5\" marker-end=\"url(#arrRed)\"/><text x=\"121\" y=\"66\" font-size=\"15\" fill=\"#dc2626\">Fms</text><line x1=\"230\" y1=\"125\" x2=\"230\" y2=\"205\" stroke=\"#d97706\" stroke-width=\"3.5\" marker-end=\"url(#arrOrange)\"/><text x=\"240\" y=\"192\" font-size=\"15\" fill=\"#d97706\">mg</text><line x1=\"230\" y1=\"125\" x2=\"292\" y2=\"45\" stroke=\"#2563eb\" stroke-width=\"3.5\" marker-end=\"url(#arr)\"/><text x=\"299\" y=\"46\" font-size=\"15\" fill=\"#2563eb\">N</text><path d=\"M385 199 A63 63 0 0 0 365 162\" fill=\"none\" stroke=\"#475569\" stroke-width=\"2\"/><text x=\"371\" y=\"177\" font-size=\"16\" fill=\"#475569\">θ</text><text x=\"68\" y=\"222\" font-size=\"13\" fill=\"#64748b\">Vật trượt xuống dốc; ma sát hướng lên dốc</text></svg>"},{"id":157,"question":"Một ô tô chạy đều trên đường nằm ngang với vận tốc 54 km/h. Công suất của động cơ ô tô là 72 kW. Xác định độ lớn lực phát động của động cơ ô tô?","type":"num","explanation":"Đổi \\(54\\,\\text{km/h}=15\\,\\text{m/s}\\), \\(P=72\\,\\text{kW}=72000\\,\\text{W}\\). Khi chạy đều, công suất kéo \\(P=Fv\\), suy ra \\(F=P/v=72000/15=4800\\,\\text{N}\\).","status":"verified","expected":4800,"unit":"N"},{"id":158,"question":"Một lực F=50 N tạo với phương ngang một góc α=30° kéo một vật và làm vật chuyển động thẳng đều trên một mặt phẳng ngang. Xác định giá trị công của lực ma sát khi vật di chuyển được một đoạn đường bằng 6 m?","type":"num","explanation":"Vật chuyển động thẳng đều nên tổng công bằng 0. Trọng lực và phản lực không sinh công vì vuông góc độ dời; do đó công ma sát triệt tiêu công của lực kéo: \\(A_{ms}=-Fs\\cos\\alpha=-50\\cdot6\\cos30^\\circ\\approx-259{,}8\\,\\text{J}\\).","status":"verified","expected":-259.8076211353316,"unit":"J"},{"id":159,"question":"Vật m=6 kg nằm yên không ma sát trên mặt phẳng ngang, tác dụng lực F=12 N dọc theo phương chuyển động. Xác định độ lớn vận tốc của vật sau khi đi được đoạn 3 m?","type":"num","explanation":"Công của lực là \\(A=Fs=12\\cdot3=36\\,\\text{J}\\). Theo định lý động năng, \\(Fs=\\tfrac12 mv^2\\), nên \\(v=\\sqrt{2Fs/m}=\\sqrt{72/6}=\\sqrt{12}\\approx3{,}46\\,\\text{m/s}\\).","status":"verified","expected":3.4641016151377544,"unit":"m/s"},{"id":160,"question":"Một vật khối lượng m chuyển động trượt xuống mặt phẳng nghiêng chiều dài s, có góc nghiêng θ. Xác định công của trọng lực?","type":"manual","explanation":"Độ giảm độ cao khi trượt xuống là \\(h=s\\sin\\theta\\). Công của trọng lực: \\(A_P=mgh=mgs\\sin\\theta\\), dương khi chuyển động xuống dốc. Câu gốc không kèm phương án.","status":"verified"},{"id":161,"question":"Một vận động viên có khối lượng 40 kg, tạo đà bằng cách đu vào sợi dây dài 2 m, ban đầu vật ở vị trí dây treo lệch với phương thẳng đứng góc 60°. Bỏ qua sức cản không khí. Xác định vận tốc của vận động viên tại vị trí cân bằng?","type":"num","explanation":"Bảo toàn cơ năng giữa vị trí thả nghỉ và vị trí thấp nhất: \\(mgL(1-\\cos60^\\circ)=\\tfrac12 mv^2\\). Khử m: \\(v=\\sqrt{2gL(1-\\cos60^\\circ)}\\). Dùng \\(g=9{,}8\\,\\text{m/s}^2\\) (đề không nêu g), \\(v=\\sqrt{19{,}6}\\approx4{,}43\\,\\text{m/s}\\).","status":"conditional","expected":4.427188724235731,"unit":"m/s","diagram":"<svg xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Vận động viên đu dây từ góc lệch 60 độ đến vị trí cân bằng\" viewBox=\"0 0 520 230\" width=\"520\" height=\"230\" style=\"max-width:100%;height:auto;display:block\"><defs><marker id=\"arr\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L6,3 L0,6 Z\" fill=\"#2563eb\"/></marker><marker id=\"arrRed\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L6,3 L0,6 Z\" fill=\"#dc2626\"/></marker><marker id=\"arrGreen\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L6,3 L0,6 Z\" fill=\"#059669\"/></marker><marker id=\"arrOrange\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L6,3 L0,6 Z\" fill=\"#d97706\"/></marker></defs><circle cx=\"260\" cy=\"24\" r=\"7\" fill=\"#334155\"/><line x1=\"260\" y1=\"24\" x2=\"260\" y2=\"206\" stroke=\"#94a3b8\" stroke-width=\"2\" stroke-dasharray=\"7 6\"/><line x1=\"260\" y1=\"24\" x2=\"112\" y2=\"129\" stroke=\"#475569\" stroke-width=\"4\"/><circle cx=\"112\" cy=\"129\" r=\"18\" fill=\"#60a5fa\" stroke=\"#1d4ed8\" stroke-width=\"2\"/><text x=\"112\" y=\"135\" text-anchor=\"middle\" font-size=\"16\" fill=\"#fff\" font-weight=\"700\">m</text><path d=\"M260 88 A64 64 0 0 0 208 56\" fill=\"none\" stroke=\"#d97706\" stroke-width=\"2.5\"/><text x=\"205\" y=\"83\" font-size=\"16\" fill=\"#d97706\">60°</text><line x1=\"260\" y1=\"24\" x2=\"260\" y2=\"206\" stroke=\"#475569\" stroke-width=\"4\" opacity=\".0\"/><circle cx=\"260\" cy=\"206\" r=\"18\" fill=\"#bbf7d0\" stroke=\"#059669\" stroke-width=\"2\"/><text x=\"260\" y=\"212\" text-anchor=\"middle\" font-size=\"15\" fill=\"#065f46\">m</text><text x=\"274\" y=\"121\" font-size=\"15\" fill=\"#475569\">L = 2 m</text><text x=\"284\" y=\"197\" font-size=\"13\" fill=\"#059669\">Vị trí cân bằng</text><text x=\"20\" y=\"224\" font-size=\"13\" fill=\"#64748b\">Bỏ qua sức cản không khí; minh họa không theo tỉ lệ</text></svg>"},{"id":162,"question":"Một con lắc lò xo có độ cứng k=40 N/m, khối lượng 1 kg, đang dao động điều hòa với biên độ A=4 cm. Xác định tốc độ của con lắc ở vị trí x=-2 cm?","type":"num","explanation":"Dùng bảo toàn năng lượng: \\(\\tfrac12 kA^2=\\tfrac12 kx^2+\\tfrac12 mv^2\\). Suy ra \\(v=\\sqrt{\\frac{k}{m}(A^2-x^2)}\\). Đổi \\(A=0{,}04\\,\\text{m}\\), \\(x=-0{,}02\\,\\text{m}\\): \\(v=\\sqrt{40(0{,}04^2-0{,}02^2)}\\approx0{,}219\\,\\text{m/s}\\).","status":"verified","expected":0.21908902300206645,"unit":"m/s"},{"id":163,"question":"Một vật được bắn lên mặt phẳng nghiêng không ma sát với vận tốc ban đầu 10 m/s. Khi lên đến đỉnh dốc thì dừng lại. Biết quãng đường vật đi được bằng 15 m. Xác định độ lớn góc nghiêng của mặt phẳng nghiêng so với phương ngang? Lấy g=10 m/s².","type":"num","explanation":"Không ma sát nên \\(\\tfrac12 mv_0^2=mgh\\), với \\(h=s\\sin\\theta\\). Do đó \\(v_0^2=2gs\\sin\\theta\\), hay \\(\\sin\\theta=100/(2\\cdot10\\cdot15)=1/3\\). Vậy \\(\\theta=\\arcsin(1/3)\\approx19{,}47^\\circ\\).","status":"verified","expected":19.47122063449069,"unit":"°"},{"id":164,"question":"Vật m=1 kg trượt từ đỉnh xuống chân mặt phẳng nghiêng dài 3 m, góc nghiêng α=30°, hệ số ma sát giữa vật và mặt phẳng nghiêng là k=0,1. Xác định tổng công của ngoại lực?","type":"num","explanation":"Tổng công bằng công trọng lực cộng công ma sát (phản lực vuông góc độ dời nên không sinh công): \\(A_{net}=mgs\\sin\\alpha-kmg\\cos\\alpha\\,s\\). Với g=9,8 m/s² do đề không ghi g: \\(A_{net}=9{,}8\\cdot3(\\sin30^\\circ-0{,}1\\cos30^\\circ)\\approx12{,}15\\,\\text{J}\\).","status":"conditional","expected":12.153885312873749,"unit":"J"},{"id":165,"question":"Một vật khối lượng 5 kg đặt trên đỉnh A với vận tốc Vₐ xuống một máng trượt không ma sát có hình dạng như hình vẽ. Xác định đáp án nào sau đây là Sai khi so sánh vận tốc các điểm trên máng trượt?","type":"mc","explanation":"Vì máng không ma sát, cơ năng bảo toàn và tốc độ tăng khi độ cao giảm. A ở 5,00 m, B ở 3,20 m, C ở 2,00 m nên \\(v_A<v_B<v_C\\). Phát biểu sai duy nhất là \\(v_B>v_C\\) (phương án A).","status":"verified","options":["V₍B₎ > V₍C₎.","V₍A₎ < V₍B₎.","V₍A₎ < V₍C₎.","V₍C₎ > V₍B₎."],"answer":0,"diagram":"<svg xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Máng trượt không ma sát với các điểm A, B, C ở những độ cao khác nhau\" viewBox=\"0 0 520 230\" width=\"520\" height=\"230\" style=\"max-width:100%;height:auto;display:block\"><defs><marker id=\"arr\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L6,3 L0,6 Z\" fill=\"#2563eb\"/></marker><marker id=\"arrRed\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L6,3 L0,6 Z\" fill=\"#dc2626\"/></marker><marker id=\"arrGreen\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L6,3 L0,6 Z\" fill=\"#059669\"/></marker><marker id=\"arrOrange\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L6,3 L0,6 Z\" fill=\"#d97706\"/></marker></defs><path d=\"M32 48 C70 48 71 77 95 105 S145 150 180 128 S225 94 252 112 S295 144 321 137 S365 111 390 134 S430 160 474 166\" fill=\"none\" stroke=\"#7dd3fc\" stroke-width=\"14\" stroke-linecap=\"round\"/><path d=\"M32 48 C70 48 71 77 95 105 S145 150 180 128 S225 94 252 112 S295 144 321 137 S365 111 390 134 S430 160 474 166\" fill=\"none\" stroke=\"#0369a1\" stroke-width=\"2.5\"/><line x1=\"32\" y1=\"48\" x2=\"32\" y2=\"206\" stroke=\"#64748b\" stroke-dasharray=\"4 4\"/><line x1=\"252\" y1=\"112\" x2=\"252\" y2=\"206\" stroke=\"#64748b\" stroke-dasharray=\"4 4\"/><line x1=\"390\" y1=\"134\" x2=\"390\" y2=\"206\" stroke=\"#64748b\" stroke-dasharray=\"4 4\"/><line x1=\"15\" y1=\"206\" x2=\"495\" y2=\"206\" stroke=\"#64748b\" stroke-width=\"3\"/><circle cx=\"32\" cy=\"48\" r=\"13\" fill=\"#dbeafe\" stroke=\"#2563eb\" stroke-width=\"2\"/><text x=\"32\" y=\"25\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"700\" fill=\"#1d4ed8\">A</text><text x=\"9\" y=\"130\" font-size=\"14\" fill=\"#475569\">5.00 m</text><circle cx=\"252\" cy=\"112\" r=\"13\" fill=\"#dbeafe\" stroke=\"#2563eb\" stroke-width=\"2\"/><text x=\"252\" y=\"89\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"700\" fill=\"#1d4ed8\">B</text><text x=\"267\" y=\"184\" font-size=\"14\" fill=\"#475569\">3.20 m</text><circle cx=\"390\" cy=\"134\" r=\"13\" fill=\"#dbeafe\" stroke=\"#2563eb\" stroke-width=\"2\"/><text x=\"390\" y=\"111\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"700\" fill=\"#1d4ed8\">C</text><text x=\"405\" y=\"190\" font-size=\"14\" fill=\"#475569\">2.00 m</text></svg>"},{"id":166,"question":"Một vật khối lượng 2 kg, trượt không vận tốc ban đầu xuống dọc theo mặt phẳng nghiêng có ma sát dài 3,5 m. Biết góc nghiêng θ=45°, hệ số ma sát k=0,1. Tính độ lớn vận tốc của vật tại chân dốc?","type":"num","explanation":"Theo định lý động năng: \\(\\tfrac12 mv^2=mgs\\sin\\theta-kmg\\cos\\theta\\,s\\), nên \\(v=\\sqrt{2gs(\\sin\\theta-k\\cos\\theta)}\\). Dùng g=9,8 m/s² (đề không nêu g): \\(v\\approx6{,}61\\,\\text{m/s}\\).","status":"conditional","expected":6.607327195656157,"unit":"m/s"},{"id":167,"question":"Một viên đạn 60 g bay đâm xuyên 10 cm vào một bức tường rắn rồi dừng lại. Giả rằng lực cản do bức tường tác dụng lên viên đạn là không đổi và bằng 15000 N. Tính toán độ lớn của vận tốc ban đầu của đạn?","type":"num","explanation":"Đổi \\(m=0{,}06\\,\\text{kg}\\), \\(d=0{,}10\\,\\text{m}\\). Công lực cản bằng độ giảm động năng: \\(Fd=\\tfrac12 mv_0^2\\). Suy ra \\(v_0=\\sqrt{2Fd/m}=\\sqrt{2\\cdot15000\\cdot0{,}1/0{,}06}\\approx223{,}61\\,\\text{m/s}\\).","status":"verified","expected":223.60679774997897,"unit":"m/s"},{"id":168,"question":"Vật có khối lượng m trượt trên mặt phẳng ngang với hệ số ma sát k=0,2. Vận tốc ban đầu ở A là 10 m/s, vận tốc khi tới B chỉ còn 2 m/s. Tính toán quãng đường AB mà vật đi được?","type":"num","explanation":"Công ma sát làm giảm động năng: \\(\\tfrac12 m(v_A^2-v_B^2)=kmgd\\). Khử m: \\(d=(v_A^2-v_B^2)/(2kg)\\). Dùng g=9,8 m/s² vì đề không nêu g: \\(d=(100-4)/(2\\cdot0{,}2\\cdot9{,}8)\\approx24{,}49\\,\\text{m}\\).","status":"conditional","expected":24.489795918367346,"unit":"m"},{"id":169,"question":"Một ô tô có khối lượng 1600 kg đang chạy với tốc độ 54 km/h thì người lái xe nhìn thấy một vật cản trước mặt cách khoảng 10 m. Người đó tắt máy và hãm phanh khẩn cấp với lực hãm không đổi là 2·10⁴ N. Tính toán khoảng cách xe dừng lại cách vật cản một khoảng bằng bao nhiêu?","type":"num","explanation":"Đổi \\(54\\,\\text{km/h}=15\\,\\text{m/s}\\). Quãng đường phanh: \\(Fd=\\tfrac12 mv^2\\Rightarrow d=mv^2/(2F)=1600\\cdot225/(2\\cdot20000)=9{,}0\\,\\text{m}\\). Lưu ý bản PDF hiển thị lực là “2.10⁴ N” theo ký hiệu thập phân/mũ; nếu hiểu là \\(2\\times10^4\\,\\text{N}\\), xe còn cách vật cản \\(10-9=1{,}0\\,\\text{m}\\) khi dừng.","status":"verified","expected":1.0,"unit":"m"},{"id":170,"question":"Một vật có khối lượng m=0,5 kg được phóng thẳng đứng từ mặt đất với vận tốc v₁=10 m/s. Lấy g=10 m/s². Bỏ qua sức cản không khí. Tính toán động năng của vật có giá trị bằng bao nhiêu khi vật đi được quãng đường 7 m?","type":"num","explanation":"Vật lên cao cực đại \\(h_{max}=v_0^2/(2g)=5\\,\\text{m}\\). Sau khi đi tổng quãng đường 7 m, nó đã lên 5 m rồi rơi xuống 2 m, nên độ cao hiện tại là 3 m. Cơ năng ban đầu \\(K_0=\\tfrac12(0{,}5)(10^2)=25\\,\\text{J}\\). Thế năng ở độ cao 3 m là \\(U=mgh=15\\,\\text{J}\\), nên động năng \\(K=25-15=10\\,\\text{J}\\).","status":"verified","expected":10,"unit":"J"},{"id":171,"question":"Vật m=4 kg bắt đầu trượt trên mặt phẳng ngang với hệ số ma sát k=0,2; chịu tác dụng của ngoại lực F=30 N hướng lên hợp với phương ngang góc θ=30°. Tính toán vận tốc của vật đạt được sau khi dịch chuyển được quãng đường 10 m?","type":"num","explanation":"Giả sử bắt đầu từ nghỉ. Với g=9,8 m/s² (đề không nêu g), phản lực \\(N=mg-F\\sin30^\\circ=39{,}2-15=24{,}2\\,\\text{N}\\). Ma sát \\(F_{ms}=kN=4{,}84\\,\\text{N}\\). Tổng công \\(A=(F\\cos30^\\circ-F_{ms})s\\approx211{,}41\\,\\text{J}\\). Theo định lý động năng, \\(\\tfrac12 mv^2=A\\), nên \\(v\\approx10{,}28\\,\\text{m/s}\\).","status":"conditional","expected":10.281235848265801,"unit":"m/s"},{"id":172,"question":"Vật m=3 kg bắt đầu trượt trên mặt phẳng ngang với hệ số ma sát k=0,1, chịu tác dụng của ngoại lực F=20 N hướng xuống hợp với phương ngang góc θ=30°. Tính vận tốc của vật sau khi dịch chuyển được quãng đường 8 m?","type":"num","explanation":"Giả sử bắt đầu từ nghỉ và dùng g=9,8 m/s² (đề không nêu g). Phản lực \\(N=mg+F\\sin30^\\circ=29{,}4+10=39{,}4\\,\\text{N}\\), ma sát \\(F_{ms}=3{,}94\\,\\text{N}\\). Công tổng \\(A=(F\\cos30^\\circ-F_{ms})s\\approx107{,}04\\,\\text{J}\\). Từ \\(A=\\tfrac12 mv^2\\), \\(v\\approx8{,}45\\,\\text{m/s}\\).","status":"conditional","expected":8.447645218462172,"unit":"m/s"},{"id":173,"question":"Một cô gái có trọng lượng 267 N trượt xuống 6,1 m trên một cầu trượt nghiêng 20° so với mặt nằm ngang. Hệ số ma sát trượt là 0,10. Tính toán tốc độ của cô gái tại chân cầu trượt nếu cô ta trượt từ đỉnh với tốc độ 0,457 m/s?","type":"num","explanation":"Theo định lý động năng, sau khi chia cho khối lượng: \\(v^2=v_0^2+2gs(\\sin20^\\circ-\\mu\\cos20^\\circ)\\). Dùng g=9,8 m/s² (đề không nêu g): \\(v=\\sqrt{0{,}457^2+2\\cdot9{,}8\\cdot6{,}1(\\sin20^\\circ-0{,}10\\cos20^\\circ)}\\approx5{,}47\\,\\text{m/s}\\). Trọng lượng 267 N triệt tiêu khi viết phương trình theo khối lượng.","status":"conditional","expected":5.464962247070023,"unit":"m/s"},{"id":174,"question":"Đoạn cong AB không ma sát, có độ cao h=3,00 m, Bx là nửa đường thẳng nằm ngang có hệ số ma sát k. Một vật khối lượng m=1 kg được thả từ A và trượt dọc theo đường ABx. Vật dừng lại tại C cách B một khoảng d=6,00 m. Cho g=10 m/s². Tính toán hệ số ma sát trên đoạn BC?","type":"num","explanation":"Đoạn AB không ma sát nên thế năng ban đầu chuyển thành động năng tại B: \\(mgh\\). Trên đoạn BC nằm ngang, công ma sát \\(kmgd\\) triệt tiêu động năng: \\(mgh=kmgd\\). Khử mg, \\(k=h/d=3/6=0{,}50\\).","status":"verified","expected":0.5},{"id":175,"question":"Một sợi dây dài L, có khối lượng không đáng kể, được giữ một đầu sao cho nó có thể quay trong một vòng tròn thẳng đứng. Người ta gắn đầu dưới của dây với một quả cầu khối lượng m=5,00 kg, và kéo quả cầu sang một bên hợp với phương thẳng đứng góc θ₀=30,00°, sau đó được thả ra. Khi quả cầu qua vị trí thấp nhất tốc độ đạt được là 5 m/s. Tính toán chiều dài dây?","type":"num","explanation":"Bảo toàn cơ năng: \\(mgL(1-\\cos\\theta_0)=\\tfrac12 mv^2\\). Khử m: \\(L=\\frac{v^2}{2g(1-\\cos30^\\circ)}\\). Dùng g=9,8 m/s² vì đề không nêu g, \\(L\\approx9{,}52\\,\\text{m}\\).","status":"conditional","expected":9.520537774410403,"unit":"m"},{"id":176,"question":"Một khối 3,0 kg rơi từ A có độ cao h=30 cm xuống một lò xo có độ cứng k=1780 N/m. Tìm độ nén tối đa của lò xo? Lấy g=10 m/s².","type":"num","explanation":"Ở độ nén cực đại x, vận tốc bằng 0. Tính từ vị trí ban đầu đến lúc nén cực đại: \\(mg(h+x)=\\tfrac12 kx^2\\). Thay số \\(30(0{,}30+x)=890x^2\\), tức \\(890x^2-30x-9=0\\). Nghiệm dương \\(x=\\frac{30+\\sqrt{30^2+4\\cdot890\\cdot9}}{1780}\\approx0{,}1188\\,\\text{m}=11{,}9\\,\\text{cm}\\).","status":"verified","expected":0.11881674244216296,"unit":"m"},{"id":177,"question":"Một vật nhỏ bắt đầu chuyển động từ điểm A với tốc độ ban đầu v₀=9 m/s. Sau khi chuyển động qua quãng đường không ma sát vật đến điểm C thì vật chuyển động trên quãng đường dài L=1,6 m với hệ số ma sát k=0,1. Tính toán vận tốc của vật tại điểm D? Với h₁=1 m, h₂=0,5 m.","type":"num","explanation":"Chọn B làm mốc thế năng. Độ cao giảm từ A đến C là \\(h_1-h_2=0{,}5\\,\\text{m}\\); ma sát chỉ thực hiện công trên CD. Bảo toàn năng lượng có kể công ma sát: \\(\\tfrac12 mv_D^2=\\tfrac12 mv_0^2+mg(h_1-h_2)-kmgL\\). Do đó \\(v_D=\\sqrt{v_0^2+2g(h_1-h_2)-2kgL}\\). Dùng g=9,8 m/s² (đề không nêu g), \\(v_D\\approx9{,}36\\,\\text{m/s}\\).","status":"conditional","expected":9.362905531938257,"unit":"m/s","diagram":"<svg xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Quỹ đạo từ A đến C không ma sát và đoạn CD dài 1,6 m có ma sát\" viewBox=\"0 0 520 230\" width=\"520\" height=\"230\" style=\"max-width:100%;height:auto;display:block\"><defs><marker id=\"arr\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L6,3 L0,6 Z\" fill=\"#2563eb\"/></marker><marker id=\"arrRed\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L6,3 L0,6 Z\" fill=\"#dc2626\"/></marker><marker id=\"arrGreen\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L6,3 L0,6 Z\" fill=\"#059669\"/></marker><marker id=\"arrOrange\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L6,3 L0,6 Z\" fill=\"#d97706\"/></marker></defs><path d=\"M35 48 L70 48 C88 50 101 100 133 142 S188 172 218 143 S251 108 282 112 L478 112\" fill=\"none\" stroke=\"#7dd3fc\" stroke-width=\"16\" stroke-linecap=\"round\"/><path d=\"M35 48 L70 48 C88 50 101 100 133 142 S188 172 218 143 S251 108 282 112 L478 112\" fill=\"none\" stroke=\"#0369a1\" stroke-width=\"2.5\"/><circle cx=\"45\" cy=\"48\" r=\"11\" fill=\"#dbeafe\" stroke=\"#2563eb\" stroke-width=\"2\"/><text x=\"45\" y=\"27\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"700\" fill=\"#1d4ed8\">A</text><circle cx=\"169\" cy=\"162\" r=\"11\" fill=\"#dbeafe\" stroke=\"#2563eb\" stroke-width=\"2\"/><text x=\"169\" y=\"191\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"700\" fill=\"#1d4ed8\">B</text><circle cx=\"282\" cy=\"112\" r=\"11\" fill=\"#dbeafe\" stroke=\"#2563eb\" stroke-width=\"2\"/><text x=\"282\" y=\"91\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"700\" fill=\"#1d4ed8\">C</text><circle cx=\"465\" cy=\"112\" r=\"11\" fill=\"#fee2e2\" stroke=\"#dc2626\" stroke-width=\"2\"/><text x=\"465\" y=\"91\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"700\" fill=\"#b91c1c\">D</text><line x1=\"22\" y1=\"48\" x2=\"22\" y2=\"162\" stroke=\"#059669\" stroke-width=\"2\"/><path d=\"M17 56 L22 46 L27 56 M17 154 L22 164 L27 154\" fill=\"none\" stroke=\"#059669\" stroke-width=\"2\"/><text x=\"0\" y=\"111\" font-size=\"13\" fill=\"#059669\">h₁=1 m</text><line x1=\"20\" y1=\"162\" x2=\"20\" y2=\"112\" stroke=\"#d97706\" stroke-width=\"1\" opacity=\"0\"/><text x=\"191\" y=\"208\" font-size=\"14\" fill=\"#475569\">h₂ = 0,5 m</text><line x1=\"302\" y1=\"139\" x2=\"449\" y2=\"139\" stroke=\"#d97706\" stroke-width=\"2\"/><path d=\"M310 133 L300 139 L310 145 M441 133 L451 139 L441 145\" fill=\"none\" stroke=\"#d97706\" stroke-width=\"2\"/><text x=\"376\" y=\"162\" text-anchor=\"middle\" font-size=\"14\" fill=\"#d97706\">L = 1,6 m</text><text x=\"332\" y=\"104\" font-size=\"12\" fill=\"#b91c1c\">Đoạn nhám</text></svg>"},{"id":178,"question":"Một viên bi thép có khối lượng 500 g được bắn thẳng đứng xuống đất từ A có độ cao 5 m với vận tốc ban đầu 10 m/s. Khi dừng lại viên bi ở sâu dưới mặt đất một khoảng BC=10 cm. Bỏ qua sức cản của không khí, lấy g=10 m/s². Tính toán lực cản trung bình của đất tác dụng lên viên bi?","type":"num","explanation":"Trước khi chạm đất, \\(v^2=v_0^2+2gh=100+100=200\\), nên động năng va chạm \\(K=\\tfrac12(0{,}5)(200)=50\\,\\text{J}\\). Trong quãng xuyên đất d=0,1 m, trọng lực sinh công \\(mgd=0{,}5\\,\\text{J}\\), còn lực cản sinh công âm. Từ \\(0-50=mgd-F_cd\\), suy ra \\(F_c=(50+0{,}5)/0{,}1=505\\,\\text{N}\\).","status":"verified","expected":505,"unit":"N","diagram":"<svg xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Viên bi rơi xuống đất và xuyên sâu 10 cm\" viewBox=\"0 0 520 230\" width=\"520\" height=\"230\" style=\"max-width:100%;height:auto;display:block\"><defs><marker id=\"arr\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L6,3 L0,6 Z\" fill=\"#2563eb\"/></marker><marker id=\"arrRed\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L6,3 L0,6 Z\" fill=\"#dc2626\"/></marker><marker id=\"arrGreen\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L6,3 L0,6 Z\" fill=\"#059669\"/></marker><marker id=\"arrOrange\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L6,3 L0,6 Z\" fill=\"#d97706\"/></marker></defs><line x1=\"45\" y1=\"178\" x2=\"474\" y2=\"178\" stroke=\"#475569\" stroke-width=\"4\"/><rect x=\"45\" y=\"178\" width=\"429\" height=\"42\" fill=\"#f3e2c6\"/><circle cx=\"155\" cy=\"49\" r=\"15\" fill=\"#94a3b8\" stroke=\"#475569\" stroke-width=\"2\"/><line x1=\"155\" y1=\"69\" x2=\"155\" y2=\"145\" stroke=\"#2563eb\" stroke-width=\"4\" marker-end=\"url(#arr)\"/><text x=\"177\" y=\"45\" font-size=\"15\" fill=\"#2563eb\">v₀ = 10 m/s</text><line x1=\"72\" y1=\"50\" x2=\"72\" y2=\"174\" stroke=\"#059669\" stroke-width=\"2\"/><path d=\"M66 59 L72 49 L78 59 M66 165 L72 175 L78 165\" fill=\"none\" stroke=\"#059669\" stroke-width=\"2\"/><text x=\"42\" y=\"115\" font-size=\"15\" fill=\"#059669\">5 m</text><circle cx=\"155\" cy=\"188\" r=\"10\" fill=\"#94a3b8\" stroke=\"#475569\" stroke-width=\"2\"/><line x1=\"155\" y1=\"199\" x2=\"155\" y2=\"216\" stroke=\"#dc2626\" stroke-width=\"3\" marker-end=\"url(#arrRed)\"/><text x=\"176\" y=\"213\" font-size=\"14\" fill=\"#dc2626\">BC = 10 cm</text><text x=\"245\" y=\"203\" font-size=\"13\" fill=\"#8b5e34\">Đất</text></svg>"},{"id":179,"question":"Một quả bóng được thả rơi từ độ cao 20 m so với mặt đất. Khi chạm đất, một phần cơ năng biến thành nhiệt năng nên quả bóng chỉ nảy lên theo phương thẳng đứng với độ cao 10 m. Tính toán tỉ số tốc độ của quả bóng trước và sau khi chạm đất?","type":"num","explanation":"Ngay trước va chạm: \\(v_{trước}=\\sqrt{2g\\cdot20}\\). Ngay sau va chạm, tốc độ hướng lên cần để đạt độ cao 10 m là \\(v_{sau}=\\sqrt{2g\\cdot10}\\). Vì vậy \\(v_{trước}/v_{sau}=\\sqrt{20/10}=\\sqrt2\\approx1{,}414\\).","status":"verified","expected":1.4142135623730951},{"id":180,"question":"Một vật khối lượng m được đẩy lên dọc theo một mặt phẳng nghiêng góc α=30° so với mặt phẳng nằm ngang. Vận tốc ban đầu của vật bằng v₀=10 m/s, hệ số ma sát giữa vật và mặt phẳng là k=0,6, lấy g=10 m/s². Tính toán quãng đường vật đi được đến khi dừng lại?","type":"num","explanation":"Khi vật đi lên, cả thành phần trọng lực dọc dốc và ma sát đều ngược chiều chuyển động. Gia tốc chậm dần có độ lớn \\(a=g(\\sin\\alpha+k\\cos\\alpha)\\). Dùng định lý động học \\(0=v_0^2-2as\\): \\(s=\\frac{v_0^2}{2g(\\sin30^\\circ+0{,}6\\cos30^\\circ)}\\approx4{,}90\\,\\text{m}\\) khi dùng đúng \\(g=10\\,\\text{m/s}^2\\) như đề cho.","status":"verified","expected":4.903810567665797,"unit":"m"},{"id":181,"question":"Một quả bóng lăn từ mặt bàn cao h=0,9 m xuống mặt đất với vận tốc ban đầu có phương ngang vA=4 m/s. Coi chuyển động quả bóng như một chuyển động ném ngang. Tính toán góc hợp bởi véctơ vận tốc v khi vật chạm đất với phương ngang một góc bằng bao nhiêu?","type":"num","explanation":"Thành phần ngang không đổi: \\(v_x=4\\,\\text{m/s}\\). Thành phần đứng khi chạm đất có độ lớn \\(v_y=\\sqrt{2gh}\\). Với g=9,8 m/s² (đề không nêu g), \\(v_y=\\sqrt{2\\cdot9{,}8\\cdot0{,}9}=4{,}2\\,\\text{m/s}\\). Góc so với phương ngang \\(\\theta=\\arctan(v_y/v_x)=\\arctan(4{,}2/4)\\approx46{,}4^\\circ\\), hướng xuống dưới phương ngang.","status":"conditional","expected":46.39718102729638,"unit":"°","diagram":"<svg xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Quả bóng ném ngang từ bàn cao 0,9 m\" viewBox=\"0 0 520 230\" width=\"520\" height=\"230\" style=\"max-width:100%;height:auto;display:block\"><defs><marker id=\"arr\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L6,3 L0,6 Z\" fill=\"#2563eb\"/></marker><marker id=\"arrRed\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L6,3 L0,6 Z\" fill=\"#dc2626\"/></marker><marker id=\"arrGreen\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L6,3 L0,6 Z\" fill=\"#059669\"/></marker><marker id=\"arrOrange\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L6,3 L0,6 Z\" fill=\"#d97706\"/></marker></defs><line x1=\"35\" y1=\"62\" x2=\"205\" y2=\"62\" stroke=\"#64748b\" stroke-width=\"4\"/><rect x=\"35\" y=\"62\" width=\"170\" height=\"20\" fill=\"#cbd5e1\"/><circle cx=\"80\" cy=\"50\" r=\"10\" fill=\"#60a5fa\" stroke=\"#1d4ed8\" stroke-width=\"2\"/><line x1=\"80\" y1=\"50\" x2=\"185\" y2=\"50\" stroke=\"#2563eb\" stroke-width=\"3\" marker-end=\"url(#arr)\"/><text x=\"92\" y=\"38\" font-size=\"14\" fill=\"#2563eb\">vA = 4 m/s</text><path d=\"M80 50 Q225 50 425 206\" fill=\"none\" stroke=\"#0f766e\" stroke-width=\"2.5\" stroke-dasharray=\"7 5\"/><line x1=\"425\" y1=\"206\" x2=\"475\" y2=\"142\" stroke=\"#dc2626\" stroke-width=\"4\" marker-end=\"url(#arrRed)\"/><line x1=\"425\" y1=\"206\" x2=\"482\" y2=\"206\" stroke=\"#94a3b8\" stroke-dasharray=\"5 5\"/><path d=\"M457 206 A32 32 0 0 0 444 180\" fill=\"none\" stroke=\"#d97706\" stroke-width=\"2\"/><text x=\"458\" y=\"180\" font-size=\"15\" fill=\"#d97706\">θ</text><line x1=\"20\" y1=\"62\" x2=\"20\" y2=\"205\" stroke=\"#059669\" stroke-width=\"2\"/><path d=\"M14 70 L20 60 L26 70 M14 197 L20 207 L26 197\" fill=\"none\" stroke=\"#059669\" stroke-width=\"2\"/><text x=\"2\" y=\"139\" font-size=\"14\" fill=\"#059669\">h=0,9 m</text><text x=\"269\" y=\"85\" font-size=\"13\" fill=\"#0f766e\">Quỹ đạo ném ngang</text></svg>"},{"id":182,"question":"Một con lắc đơn, vật nặng m gắn với sợi dây nhẹ dài l. Kéo con lắc lệch góc α₀ so với phương thẳng đứng rồi thả nhẹ, bỏ qua mọi ma sát. Tính động năng của con lắc khi đến vị trí có góc lệch α so với phương thẳng đứng?","type":"manual","explanation":"Bảo toàn cơ năng. Lấy mốc thế năng tại vị trí thấp nhất: ở góc lệch β, \\(U(\\beta)=mg\\ell(1-\\cos\\beta)\\). Ban đầu thả nhẹ tại α₀ nên \\(K_0=0\\). Do đó \\(K=U(\\alpha_0)-U(\\alpha)=mg\\ell(\\cos\\alpha-\\cos\\alpha_0)\\).","status":"verified"}];

const esc = value => String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));

function extractParams(text) {
  const patterns = [
    /(?:m|khối lượng)\s*=\s*[\d.,]+\s*(?:kg|g)?/i,
    /(?:h|độ cao)\s*=\s*[\d.,]+\s*m?/i,
    /(?:v₀|v0|v_0|vận tốc ban đầu)\s*=\s*[\d.,]+\s*(?:m\/s)?/i,
    /(?:k|μ|mu|hệ số ma sát)\s*=\s*[\d.,]+/i,
    /(?:α|góc nghiêng|góc ném)\s*=\s*[\d.,]+\s*°?/i,
    /(?:F|lực kéo)\s*=\s*[\d.,]+\s*N?/i,
    /(?:s|quãng đường)\s*=\s*[\d.,]+\s*m?/i,
    /(?:P|công suất)\s*=\s*[\d.,]+\s*W?/i
  ];
  const found=[];
  for(const re of patterns){const m=text.match(re);if(m && !found.includes(m[0])) found.push(m[0].replace(/\s+/g,' '));}
  return found.slice(0,4);
}

function getDiagram(q) {
  const d = q.diagram || '';
  return d && /<svg[\s>]/i.test(d) ? d : makeDiagram(q);
}
function scoreStats() {
  let earned=0, max=0, completed=0;
  questions.forEach((q,i)=>{
    const st=answers[i];
    if(q.type==='mc' && Number.isInteger(q.answer)) { max+=10; if(st.correct===true) earned+=10; }
    if(q.type==='num' && Number.isFinite(Number(q.expected))) { max+=10; if(st.correct===true) earned+=10; }
    if(st.submitted) completed++;
  });
  return {earned,max,completed};
}
function initJumpSelect() {
  const select=$('question-select');
  questions.forEach((q,i)=>{
    const opt=document.createElement('option');
    opt.value=i; opt.textContent=`Câu ${i+1} (Câu gốc ${q.id})`;
    select.appendChild(opt);
  });
}
function renderQ() {
  const q=questions[curr], st=answers[curr], stats=scoreStats();
  $('progress-fill').style.width=`${((curr+1)/questions.length)*100}%`;
  let out=`<div class="meta"><span>📝 Câu ${curr+1} / ${questions.length} · Mã câu gốc ${q.id}</span><span>Điểm: ${stats.earned} / ${stats.max} · Đã làm: ${stats.completed}/${questions.length}</span></div>`;
  out+=`<div class="q">${q.question}</div><div class="fig">${getDiagram(q)}</div>`;
  if(q.type==='mc') {
    q.options.forEach((opt,i)=>{
      let cls='';
      if(st.submitted && Number.isInteger(q.answer)) cls=i===q.answer?'ok':(i===st.choice?'no':'');
      out+=`<button type="button" class="opt ${cls}" data-choice="${i}" ${st.submitted?'disabled':''}><span class="l">${letters[i]||i+1}</span><span>${opt}</span></button>`;
    });
    if(q.status==='review') out+=`<p class="note">Lưu ý: câu này cần rà soát thuật ngữ theo ghi chú trong lời giải; hệ thống không tự chấm điểm câu này.</p>`;
  } else {
    const isNum=q.type==='num';
    out+=`<label class="hint" for="custom-answer">${isNum?'Nhập kết quả số':'Nhập công thức hoặc câu trả lời ngắn'}${isNum && q.unit?` · Đơn vị: ${esc(q.unit)}`:''}</label>`;
    out+=`<input id="custom-answer" type="text" class="input-area" autocomplete="off" placeholder="${isNum?'Ví dụ: 12,5':'Nhập câu trả lời của bạn…'}" value="${esc(st.value)}" ${st.submitted?'disabled':''}>`;
    if(!st.submitted) out+=`<button type="button" class="btn btn-primary" id="check-input" style="width:100%;max-width:260px;margin:0 auto">Kiểm Tra Đáp Án</button>`;
    else if(isNum) out+=`<div class="feedback ${st.correct?'good':'bad'}">${st.correct?'Chính xác!':'Chưa khớp với đáp án số tham chiếu.'} ${q.unit?`Đơn vị tham chiếu: ${esc(q.unit)}.`:''}</div>`;
    else out+=`<div class="feedback neutral">Đã ghi nhận câu trả lời. Hãy đối chiếu với lời giải chi tiết bên dưới; câu tự luận không được chấm tự động.</div>`;
  }
  if(st.submitted && q.type==='mc' && Number.isInteger(q.answer)) {
    out+=`<div class="feedback ${st.correct?'good':'bad'}">${st.correct?'Chính xác! Bạn được 10 điểm.':`Chưa chính xác. Đáp án đúng: ${letters[q.answer]}.`}</div>`;
  }
  out+=`<div class="exp ${st.submitted?'on':''}"><h3>💡 Lời Giải Chi Tiết</h3><p>${q.explanation||'Tài liệu nguồn chưa cung cấp lời giải chi tiết cho câu này.'}</p>${q.note?`<p style="margin-top:8px"><strong>Ghi chú:</strong> ${esc(q.note)}</p>`:''}</div>`;
  $('question-content').innerHTML=out;
  $('btn-prev').disabled=curr===0;
  $('btn-next').disabled=curr===questions.length-1;
  $('question-select').value=String(curr);
  $('question-select').setAttribute('aria-label',`Câu đang xem ${curr+1}`);
  $('question-content').querySelectorAll('[data-choice]').forEach(btn=>btn.addEventListener('click',()=>checkMC(Number(btn.dataset.choice))));
  const check=$('check-input');
  if(check) check.addEventListener('click',checkInput);
  if(window.MathJax?.typesetPromise) MathJax.typesetPromise([$ ('question-content')]).catch(()=>{});
}
function checkMC(choice) {
  const q=questions[curr], st=answers[curr];
  if(st.submitted) return;
  st.submitted=true; st.choice=choice;
  if(Number.isInteger(q.answer)) st.correct=choice===q.answer;
  else st.correct=null;
  renderQ();
}
function parseNumber(value) {
  let s=String(value).trim().replace(/\s/g,'').replace(/,/g,'.');
  s=s.replace(/(m\/s|m\/s2|m\/s²|kg|J|N|W|m|s|°)$/i,'');
  const n=Number(s);
  return Number.isFinite(n)?n:null;
}
function checkInput() {
  const q=questions[curr], st=answers[curr], el=$('custom-answer');
  if(!el || st.submitted) return;
  const value=el.value.trim();
  if(!value){alert('Vui lòng nhập đáp án trước khi kiểm tra.');el.focus();return;}
  st.value=value; st.submitted=true;
  if(q.type==='num' && Number.isFinite(Number(q.expected))) {
    const actual=parseNumber(value), expected=Number(q.expected);
    const tolerance=Math.max(0.02,Math.abs(expected)*0.015);
    st.correct=actual!==null && Math.abs(actual-expected)<=tolerance;
  } else st.correct=null;
  renderQ();
}
function nextQ(){if(curr<questions.length-1){curr++;renderQ();}}
function prevQ(){if(curr>0){curr--;renderQ();}}
function jumpToQuestion(index){const n=Number(index);if(Number.isInteger(n)&&n>=0&&n<questions.length){curr=n;renderQ();}}
$('btn-prev').addEventListener('click',prevQ);
$('btn-next').addEventListener('click',nextQ);
$('question-select').addEventListener('change',e=>jumpToQuestion(e.target.value));
initJumpSelect();
renderQ();
</script>
