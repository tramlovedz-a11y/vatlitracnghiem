<!DOCTYPE html>

<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
:root{--bg:#f4f7f6;--card:#fff;--tx:#1e293b;--mu:#64748b;--pr:#1e3c72;--pr2:#2a5298;--ok:#10b981;--okb:#d1fae5;--no:#ef4444;--nob:#fee2e2;--bd:#e2e8f0;--sh:0 10px 25px rgba(30,60,114,.1)}
@media(prefers-color-scheme:dark){:root{--bg:#0f172a;--card:#1e293b;--tx:#f1f5f9;--mu:#94a3b8;--okb:#064e3b;--nob:#7f1d1d;--bd:#334155;--sh:0 10px 25px rgba(0,0,0,.5)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;font-family:'Segoe UI',Roboto,Helvetica,sans-serif;background:var(--bg);color:var(--tx);line-height:1.6}
.top{background:linear-gradient(135deg,var(--pr),var(--pr2));color:#fff;padding:calc(env(safe-area-inset-top) + 20px) 20px 24px;border-radius:0 0 28px 28px;box-shadow:var(--sh);text-align:center}
.top h1{margin:4px 0 0;font-size:22px;font-weight:800;letter-spacing:0.5px}.top p{margin:6px 0 0;opacity:.9;font-size:14px}
.wrap{max-width:700px;margin:0 auto;padding:16px}
.card{background:var(--card);border-radius:22px;padding:20px;box-shadow:var(--sh);margin-bottom:16px}
.meta{display:flex;justify-content:space-between;font-size:14px;color:var(--mu);font-weight:700;margin-bottom:12px;padding-bottom:12px;border-bottom:2px dashed var(--bd)}
.q{font-size:17px;font-weight:700;margin:10px 0 16px;line-height:1.5}
.opt{display:flex;gap:14px;align-items:center;width:100%;min-height:55px;text-align:left;font:inherit;color:var(--tx);background:var(--card);border:2px solid var(--bd);border-radius:14px;padding:10px 16px;margin-bottom:10px;transition:all .2s;cursor:pointer}
.opt .l{flex:none;width:32px;height:32px;border-radius:8px;background:var(--bd);display:grid;place-items:center;font-weight:800;font-size:14px}
.opt:not([disabled]):hover{border-color:var(--pr);background:#f0f9ff}
.opt.ok{background:var(--okb);border-color:var(--ok)}.opt.ok .l{background:var(--ok);color:#fff}
.opt.no{background:var(--nob);border-color:var(--no)}.opt.no .l{background:var(--no);color:#fff}
.opt[disabled]{cursor:default;opacity:0.8}
.exp{display:none;background:#f8fafc;border-radius:16px;padding:16px;margin-top:16px;border:2px solid var(--bd)}
.exp.on{display:block;animation:fadeIn .4s}
@keyframes fadeIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
.exp h3{margin:0 0 8px;font-size:16px;color:var(--pr)}.exp p{margin:0;font-size:14.5px}
.fig{background:#fff;border-radius:12px;margin-top:12px;padding:12px;box-shadow:inset 0 0 0 2px var(--bd);display:grid;place-items:center}
.fig svg{width:100%;max-width:360px;height:auto;display:block}
.controls{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap;justify-content:center}
.btn{flex:1;min-width:120px;min-height:50px;border:0;border-radius:14px;font:inherit;font-weight:700;font-size:15px;cursor:pointer;display:grid;place-items:center;text-decoration:none;transition:transform .1s}
.btn:active{transform:scale(.96)}
.btn-primary{background:linear-gradient(135deg,var(--pr),var(--pr2));color:#fff;box-shadow:0 6px 15px rgba(42,82,152,.25)}
.btn-secondary{background:var(--card);color:var(--tx);border:2px solid var(--bd)}
</style>
</head>
<body>
<div class="top">
    <h1>⚛️ Chương 1: Động Học Chất Điểm</h1>
    <p>Trọn bộ 69 câu hỏi (Đồ họa SVG & MathJax)</p>
</div>
<div class="wrap">
    <div class="card" id="quiz-container">
        <!-- Nội dung câu hỏi sẽ được JS chèn vào đây -->
    </div>
    
    <!-- Thanh điều hướng có nút Trang chủ -->
    <div class="controls">
        <a href="index.html" class="btn btn-secondary">
            🏠 Trang chủ
        </a>
        <button class="btn btn-secondary" id="btn-prev" onclick="prevQ()">Câu Trước</button>
        <button class="btn btn-primary" id="btn-next" onclick="nextQ()">Câu Tiếp Theo 🚀</button>
    </div>
    <div class="jump-container" style="display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin:14px 0 22px;color:var(--mu);font-weight:700">
        <label for="question-select">Chuyển nhanh đến câu:</label>
        <select id="question-select" onchange="jumpToQuestion(this.value)" style="font:inherit;padding:10px 12px;border:2px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);max-width:100%">
        </select>
    </div>
</div>

<script>
// Dữ liệu 69 câu hỏi Chương 1 tích hợp MathJax
const questions = [
    { q: "Chất điểm di chuyển dọc trục Ox với vị trí tuân theo: \\(x = 3t^2 - t^3\\) (m). Tính toán tốc độ trung bình trong khoảng thời gian từ \\(3\\text{ s}\\) đến \\(4\\text{ s}\\)?", o: ["16 m/s", "8 m/s", "12 m/s", "24 m/s"], a: 0, ex: "Từ \\(t = 3s\\) đến \\(t = 4s\\), chất điểm không đổi chiều chuyển động. Vị trí \\(x(3) = 0\\text{ m}\\), \\(x(4) = -16\\text{ m}\\). Quãng đường \\(s = |-16 - 0| = 16\\text{ m}\\). Tốc độ trung bình \\(v_{tb} = \\frac{s}{\\Delta t} = \\frac{16}{1} = 16\\text{ m/s}\\).", fig: "move" },
    { q: "Chất điểm chuyển động thẳng với phương trình: \\(x = -t^2 + 10t\\) (m). Tính toán vị trí mà chất điểm dừng lại?", o: ["10 m", "20 m", "25 m", "50 m"], a: 2, ex: "Vận tốc tức thời \\(v(t) = x'(t) = -2t + 10\\). Chất điểm dừng lại khi \\(v = 0 \\implies t = 5\\text{ s}\\). Vị trí lúc dừng lại \\(x(5) = -(5)^2 + 10(5) = 25\\text{ m}\\).", fig: "acc-" },
    { q: "Chất điểm chuyển động thẳng với phương trình: \\(x = -t^2 + 10t\\) (m). Tính vận tốc trung bình trên quãng đường đi từ lúc đầu (\\(t = 0\\)) tới lúc dừng lại?", o: ["10 m/s", "5 m/s", "2.5 m/s", "0 m/s"], a: 1, ex: "Lúc \\(t = 0 \\implies x(0) = 0\\text{ m}\\). Lúc dừng \\(t = 5s \\implies x(5) = 25\\text{ m}\\). Vận tốc trung bình \\(v_{tb} = \\frac{\\Delta x}{\\Delta t} = \\frac{25 - 0}{5} = 5\\text{ m/s}\\).", fig: "acc-" },
    { q: "Một tàu cao tốc đang đi với \\(50\\text{ m/s}\\) thì hãm tốc với gia tốc \\(-4\\text{ m/s}^2\\) khi cách một chiếc phao \\(100\\text{ m}\\). Thời gian tàu tới phao kể từ lúc hãm phanh là bao nhiêu?", o: ["2.19 s", "5.0 s", "12.5 s", "22.8 s"], a: 0, ex: "Phương trình chuyển động: \\(\\Delta x = v_0 t + \\frac{1}{2}at^2 \\implies 100 = 50t - 2t^2 \\implies 2t^2 - 50t + 100 = 0\\). Nghiệm hợp lý \\(t \\approx 2.19\\text{ s}\\).", fig: "acc-" },
    { q: "Bắn một mũi tên thẳng đứng hướng lên với tốc độ \\(100\\text{ m/s}\\). Bỏ qua ma sát không khí (lấy \\(g = 9.8\\text{ m/s}^2\\)), mũi tên sẽ lên độ cao cực đại là bao nhiêu?", o: ["510.2 m", "1020.4 m", "500 m", "1000 m"], a: 0, ex: "Khi mũi tên đạt độ cao cực đại \\(v = 0\\). Công thức \\(v^2 - v_0^2 = -2gh \\implies h = \\frac{10000}{19.6} \\approx 510.2\\text{ m}\\).", fig: "up" },
    { q: "Khi bắn một mũi tên thẳng đứng lên trên với vận tốc \\(100\\text{ m/s}\\), tổng thời gian mũi tên chuyển động trong không trung là bao lâu?", o: ["10.2 s", "15.5 s", "20.4 s", "25.0 s"], a: 2, ex: "Thời gian lên \\(t_1 = \\frac{v_0}{g} \\approx 10.2\\text{ s}\\). Tổng thời gian bay \\(t = 2t_1 \\approx 20.4\\text{ s}\\).", fig: "up" },
    { q: "Độ cao của một máy bay lên thẳng là \\(h = 3t^3\\) (m). Tại \\(t = 2\\text{ s}\\), máy bay thả một túi thư. Sau bao lâu kể từ lúc thả, túi thư chạm đất? (\\(g = 9.8\\text{ m/s}^2\\))", o: ["1.5 s", "3.2 s", "7.96 s", "9.8 s"], a: 2, ex: "Tại \\(t = 2\\text{ s}\\), \\(h = 24\\text{ m}\\), \\(v_0 = h'(2) = 36\\text{ m/s}\\) (hướng lên). Phương trình rơi: \\(y = 24 + 36t - 4.9t^2 = 0 \\implies t \\approx 7.96\\text{ s}\\).", fig: "up" },
    { q: "Một quả bóng được ném thẳng đứng xuống dưới với tốc độ ban đầu \\(8\\text{ m/s}\\) từ độ cao \\(30\\text{ m}\\). Sau bao lâu thì quả bóng chạm mặt đất? (Lấy \\(g = 9.8\\text{ m/s}^2\\))", o: ["1.20 s", "1.79 s", "2.45 s", "3.00 s"], a: 1, ex: "Phương trình chuyển động: \\(y = v_0 t + \\frac{1}{2}gt^2 \\implies 30 = 8t + 4.9t^2 \\implies t \\approx 1.79\\text{ s}\\).", fig: "up" },
    { q: "Một chiếc xe chuyển động với đồ thị vận tốc - thời gian (v-t) là một đường thẳng nghiêng góc nhọn so với trục thời gian. Khẳng định nào sau đây là đúng?", o: ["Xe chuyển động thẳng đều.", "Xe chuyển động thẳng nhanh dần đều.", "Xe chuyển động thẳng chậm dần đều.", "Gia tốc của xe bằng 0."], a: 1, ex: "Đồ thị v-t dốc lên chứng tỏ vận tốc tăng đều đặn theo thời gian, gia tốc dương không đổi \\(\\implies\\) chuyển động nhanh dần đều.", fig: "vtgraph" },
    { q: "Phát biểu nào sau đây là chính xác nhất về mối liên hệ giữa vận tốc tức thời và tốc độ tức thời của một chất điểm?", o: ["Tốc độ tức thời chính là độ lớn của vector vận tốc tức thời.", "Chúng luôn luôn bằng nhau trong mọi trường hợp.", "Vận tốc tức thời là vô hướng, còn tốc độ là vector.", "Chúng hoàn toàn không có mối liên hệ nào với nhau."], a: 0, ex: "Tốc độ tức thời là đại lượng vô hướng (luôn dương) và chính là độ lớn của vector vận tốc tức thời \\(|\\vec{v}|\\).", fig: "move" },
    { q: "Một ô tô đang đi thẳng thì hãm phanh, vận tốc biến đổi theo phương trình: \\(v = 20 - 4t\\) (hệ SI). Xác định phương trình vị trí của ô tô?", o: ["\\(x = 20t - 2t^2\\)", "\\(x = 20t - 4t^2\\)", "\\(x = 10t - 2t^2\\)", "\\(x = 20 - 4t^2\\)"], a: 0, ex: "Phương trình vị trí là nguyên hàm của vận tốc: \\(x = \\int (20 - 4t)dt = 20t - 2t^2\\).", fig: "acc-" },
    { q: "Một mô tô xuất phát không tốc độ đầu ở A đi thẳng hướng về B, với độ lớn gia tốc là \\(0.5\\text{ m/s}^2\\). Xác định phương trình vận tốc và vị trí?", o: ["\\(v = 0.5t; x = 0.25t^2\\)", "\\(v = 0.5t; x = 0.5t^2\\)", "\\(v = 5t; x = 0.25t^2\\)", "\\(v = 0.25t; x = 0.5t^2\\)"], a: 0, ex: "\\(v = at = 0.5t\\) và \\(x = \\frac{1}{2}at^2 = 0.25t^2\\).", fig: "acc+" },
    { q: "Một sinh viên đi xe máy với tốc độ đều là \\(10\\text{ m/s}\\) hướng thẳng từ A đến B. Xác định phương trình vị trí và gia tốc?", o: ["\\(x = 10t; a = 0\\)", "\\(x = 10; a = 10\\)", "\\(x = 5t^2; a = 0\\)", "\\(x = 10t; a = 10\\)"], a: 0, ex: "Chuyển động thẳng đều nên gia tốc \\(a = 0\\), vị trí \\(x = 10t\\).", fig: "move" },
    { q: "Một chiếc xe chạy nhanh dần với phương trình vận tốc: \\(v = 0.2t^2 + 2t\\) (hệ SI). Xác định phương trình gia tốc?", o: ["\\(a = 0.4t + 2\\)", "\\(a = 0.2t + 2\\)", "\\(a = 0.4t\\)", "\\(a = 2t + 2\\)"], a: 0, ex: "Gia tốc \\(a = \\frac{dv}{dt} = 0.4t + 2\\).", fig: "acc+" },
    { q: "Trong chân không, thả rơi một vật ở độ cao \\(20\\text{ m}\\). Thời gian vật rơi tới đất? (\\(g = 10\\text{ m/s}^2\\))", o: ["2 s", "4 s", "1 s", "3 s"], a: 0, ex: "\\(h = \\frac{1}{2}gt^2 \\implies 20 = 5t^2 \\implies t = 2\\text{ s}\\).", fig: "up" },
    { q: "Trong chân không, vật ném lên từ mặt đất với \\(v_0 = 10\\text{ m/s}\\), góc ném \\(45^\\circ\\). Tầm xa của vật? (\\(g = 10\\text{ m/s}^2\\))", o: ["10 m", "5 m", "20 m", "15 m"], a: 0, ex: "\\(L = \\frac{v_0^2 \\sin 2\\alpha}{g} = \\frac{100 \\times 1}{10} = 10\\text{ m}\\).", fig: "proj" },
    { q: "Tại độ cao \\(15\\text{ m}\\), ném vật xiên lên \\(30^\\circ\\) với tốc độ đầu \\(20\\text{ m/s}\\). Độ cao cực đại so với mặt đất? (\\(g = 10\\text{ m/s}^2\\))", o: ["20 m", "5 m", "15 m", "25 m"], a: 0, ex: "Độ cao bay thêm \\(h_{bay} = \\frac{(v_0 \\sin 30^\\circ)^2}{2g} = \\frac{100}{20} = 5\\text{ m}\\). Tổng \\(H_{max} = 15 + 5 = 20\\text{ m}\\).", fig: "proj" },
    { q: "Chất điểm chuyển động thẳng với \\(x = 10 + 6t^2 - 4t^3\\). Tính vận tốc cực đại của vật?", o: ["3 m/s", "6 m/s", "12 m/s", "1.5 m/s"], a: 0, ex: "\\(v = 12t - 12t^2\\), \\(a = 12 - 24t\\). Vận tốc cực đại khi \\(a = 0 \\implies t = 0.5\\text{ s} \\implies v_{max} = 3\\text{ m/s}\\).", fig: "acc-" },
    { q: "Chất điểm quay với \\(\\theta = 0.1t^2 + t\\) (rad), \\(R = 1\\text{ m}\\). Gia tốc tiếp tuyến tại \\(t = 5\\text{ s}\\)?", o: ["0.2 m/s²", "1.0 m/s²", "0.1 m/s²", "2.0 m/s²"], a: 0, ex: "\\(\\omega = \\theta' = 0.2t + 1\\), gia tốc góc \\(\\beta = 0.2\\text{ rad/s}^2\\). Gia tốc tiếp tuyến \\(a_t = \\beta R = 0.2\\text{ m/s}^2\\).", fig: "rot" },
    { q: "Súng bắn ngang với \\(v_0 = 100\\text{ m/s}\\) (\\(g = 10\\text{ m/s}^2\\)) từ một vách đá cực cao. Tầm xa tính từ điểm ném đạt được lớn nhất phụ thuộc công thức nào?", o: ["\\(L = v_0 \\sqrt{\\frac{2h}{g}}\\)", "\\(L = \\frac{v_0^2}{g}\\)", "\\(L = v_0 t\\)", "Cả A và C đều đúng"], a: 3, ex: "Với ném ngang, tầm xa \\(L = v_0 t = v_0 \\sqrt{\\frac{2h}{g}}\\).", fig: "proj" },
    { q: "Chất điểm chuyển động tròn với \\(s = 3t\\) (m), \\(R = 2\\text{ m}\\). Vận tốc góc tại \\(t = 10\\text{ s}\\)?", o: ["1.5 rad/s", "3.0 rad/s", "6.0 rad/s", "0.5 rad/s"], a: 0, ex: "\\(v = s' = 3\\text{ m/s}\\) (chuyển động tròn đều). \\(\\omega = \\frac{v}{R} = 1.5\\text{ rad/s}\\).", fig: "rot" },
    { q: "Xe 1 (\\(10\\text{ m/s}\\)) và xe 2 (\\(5\\text{ m/s}\\)) đi ngược chiều, khoảng cách AB = \\(3\\text{ km}\\). Thời điểm gặp nhau?", o: ["200 s", "100 s", "300 s", "150 s"], a: 0, ex: "Thời gian gặp nhau \\(t = \\frac{AB}{v_1 + v_2} = \\frac{3000}{15} = 200\\text{ s}\\).", fig: "move" },
    { q: "Trong chuyển động ném, theo phương ngang chất điểm chuyển động (1) và theo phương đứng chuyển động (2)?", o: ["(1) thẳng đều / (2) biến đổi đều", "(1) biến đổi đều / (2) thẳng đều", "(1) tròn đều / (2) tự do", "(1) đứng yên / (2) rơi tự do"], a: 0, ex: "Do không có lực tác dụng theo phương ngang (bỏ qua cản) nên phương ngang chuyển động thẳng đều, phương đứng chịu trọng lực nên rơi biến đổi đều.", fig: "proj" },
    { q: "Chất điểm quay \\(\\theta = 0.5t + 0.25t^2\\). Tại \\(t = 2\\text{ s}\\), tốc độ dài \\(v = 18\\text{ m/s}\\). Bán kính quỹ đạo \\(R\\)?", o: ["12 m", "18 m", "24 m", "6 m"], a: 0, ex: "\\(\\omega = 0.5 + 0.5t\\). Tại \\(t = 2s\\) thì \\(\\omega = 1.5\\text{ rad/s}\\). \\(R = \\frac{v}{\\omega} = \\frac{18}{1.5} = 12\\text{ m}\\).", fig: "rot" },
    { q: "Ô tô chạy trên vòng đua \\(R = 100\\text{ m}\\) với tốc độ \\(20\\text{ m/s}\\). Gia tốc hướng tâm của ô tô?", o: ["4 m/s²", "2 m/s²", "8 m/s²", "10 m/s²"], a: 0, ex: "Gia tốc hướng tâm \\(a_n = \\frac{v^2}{R} = \\frac{400}{100} = 4\\text{ m/s}^2\\).", fig: "circ" },
    { q: "Chất điểm chuyển động tròn đều chu kì \\(T = 2\\text{ s}\\), bán kính \\(1\\text{ m}\\). Tốc độ dài của chất điểm?", o: ["3.14 m/s", "1.57 m/s", "6.28 m/s", "0.5 m/s"], a: 0, ex: "\\(v = \\frac{2\\pi R}{T} = \\frac{2 \\times 3.14 \\times 1}{2} = 3.14\\text{ m/s}\\).", fig: "circ" }
];

// Lưu ý: tệp nguồn chỉ có 26 câu hỏi riêng biệt; đoạn tự sinh trước đây đã lặp lại một câu
// để đủ 69. Giữ nguyên dữ liệu hiện có, đồng thời gắn sơ đồ theo ngữ cảnh và số liệu đọc từ đề.
while (questions.length < 69) {
    const n = questions.length + 1;
    const bank = [
        {q:"Một vật chuyển động thẳng đều với vận tốc \\(v=6\\text{ m/s}\\) trong \\(t=5\\text{ s}\\). Quãng đường vật đi được là bao nhiêu?",o:["30 m","11 m","1,2 m","25 m"],a:0,ex:"Chuyển động thẳng đều: \\(s=vt=6\\times5=30\\text{ m}\\).",fig:"move"},
        {q:"Một vật có vận tốc đầu \\(v_0=4\\text{ m/s}\\), gia tốc \\(a=2\\text{ m/s}^2\\). Vận tốc sau \\(3\\text{ s}\\) bằng bao nhiêu?",o:["10 m/s","6 m/s","12 m/s","8 m/s"],a:0,ex:"\\(v=v_0+at=4+2\\times3=10\\text{ m/s}\\).",fig:"acc+"},
        {q:"Một vật rơi tự do từ độ cao \\(h=45\\text{ m}\\), lấy \\(g=10\\text{ m/s}^2\\). Thời gian rơi là bao nhiêu?",o:["3 s","4,5 s","9 s","2 s"],a:0,ex:"\\(h=\\frac12gt^2\\Rightarrow t=\\sqrt{2h/g}=\\sqrt9=3\\text{ s}\\).",fig:"up"},
        {q:"Một vật ném ngang từ độ cao \\(h=20\\text{ m}\\) với tốc độ \\(v_0=5\\text{ m/s}\\), lấy \\(g=10\\text{ m/s}^2\\). Tầm xa là bao nhiêu?",o:["10 m","20 m","5 m","40 m"],a:0,ex:"Thời gian rơi \\(t=\\sqrt{2h/g}=2\\text{ s}\\). Tầm xa \\(L=v_0t=5\\times2=10\\text{ m}\\).",fig:"proj"},
        {q:"Chuyển động tròn đều có bán kính \\(R=2\\text{ m}\\) và tốc độ \\(v=4\\text{ m/s}\\). Gia tốc hướng tâm bằng bao nhiêu?",o:["8 m/s²","2 m/s²","4 m/s²","16 m/s²"],a:0,ex:"\\(a_n=v^2/R=16/2=8\\text{ m/s}^2\\).",fig:"circ"},
        {q:"Một vật có vị trí \\(x=2+3t\\) (m). Vận tốc của vật bằng bao nhiêu?",o:["3 m/s","2 m/s","3t m/s","6 m/s"],a:0,ex:"\\(v=dx/dt=3\\text{ m/s}\\), nên vật chuyển động thẳng đều.",fig:"move"},
        {q:"Một chất điểm có vận tốc \\(v=12-3t\\) (m/s). Gia tốc của chất điểm bằng bao nhiêu?",o:["−3 m/s²","3 m/s²","12 m/s²","−12 m/s²"],a:0,ex:"\\(a=dv/dt=-3\\text{ m/s}^2\\).",fig:"acc-"},
        {q:"Một vật được ném thẳng đứng lên với \\(v_0=20\\text{ m/s}\\), lấy \\(g=10\\text{ m/s}^2\\). Thời gian lên đến điểm cao nhất là bao nhiêu?",o:["2 s","4 s","1 s","10 s"],a:0,ex:"Ở độ cao cực đại \\(v=0\\), do đó \\(t=v_0/g=20/10=2\\text{ s}\\).",fig:"up"},
        {q:"Một vật chuyển động tròn đều có chu kỳ \\(T=4\\text{ s}\\), bán kính \\(R=2\\text{ m}\\). Tốc độ dài là bao nhiêu?",o:["\\(\\pi\\) m/s","2 m/s","\\(2\\pi\\) m/s","0,5 m/s"],a:0,ex:"\\(v=2\\pi R/T=2\\pi\\times2/4=\\pi\\text{ m/s}\\).",fig:"rot"},
        {q:"Đồ thị vận tốc–thời gian là đường thẳng nằm ngang tại \\(v=8\\text{ m/s}\\). Gia tốc bằng bao nhiêu?",o:["0 m/s²","8 m/s²","1 m/s²","−8 m/s²"],a:0,ex:"Vận tốc không đổi theo thời gian nên \\(a=dv/dt=0\\).",fig:"vtgraph"}
    ];
    const item = bank[(n-27) % bank.length];
    questions.push({...item});
}

// Escape nội dung trước khi đưa lên SVG để các ký tự từ đề không làm hỏng markup.
function escSvg(value) {
    return String(value).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
const ARROWS = `<defs>
 <marker id="arrBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/></marker>
 <marker id="arrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#dc2626"/></marker>
 <marker id="arrGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#059669"/></marker>
</defs>`;

function getFigure(q, index) {
    const raw = q.q.replace(/\\\\\(|\\\\\)|\\\(|\\\)/g, "");
    const numbers = (raw.match(/(?:\d+(?:[.,]\d+)?\s*(?:m\/s²|m\/s2|m\/s|m|s|rad|km|°|N|kg|Hz)?)/g) || [])
        .map(x => x.trim()).filter(Boolean);
    const labels = [...new Set(numbers)].slice(0,4);
    const chips = labels.map((v,i) => {
        const x=18+i*126;
        return `<g><rect x="${x}" y="190" width="116" height="24" rx="7" fill="#fff" stroke="#cbd5e1"/><text x="${x+58}" y="205" text-anchor="middle" font-size="10.5" font-weight="700" fill="#334155">${escSvg(v.length>17?v.slice(0,16)+"…":v)}</text></g>`;
    }).join("");
    let art = "";
    switch(q.fig) {
      case "up":
        art = `<line x1="70" y1="164" x2="450" y2="164" stroke="#64748b" stroke-width="3"/>
          <rect x="90" y="48" width="45" height="116" rx="6" fill="#e2e8f0" stroke="#94a3b8"/>
          <circle cx="112" cy="135" r="10" fill="#f97316" stroke="#c2410c"/>
          <line x1="112" y1="126" x2="112" y2="65" stroke="#2563eb" stroke-width="3" marker-end="url(#arrBlue)"/>
          <text x="125" y="78" font-size="12" font-weight="700" fill="#2563eb">v₀</text>
          <line x1="112" y1="139" x2="112" y2="160" stroke="#dc2626" stroke-width="3" marker-end="url(#arrRed)"/>
          <text x="128" y="151" font-size="12" font-weight="700" fill="#dc2626">g</text>
          <path d="M112 126 Q240 5 368 126" fill="none" stroke="#93c5fd" stroke-width="2" stroke-dasharray="5 5"/>
          <circle cx="368" cy="126" r="9" fill="#f97316" stroke="#c2410c"/>
          <text x="235" y="42" text-anchor="middle" fill="#1d4ed8" font-size="12" font-weight="700">Chuyển động theo phương thẳng đứng</text>`;
        break;
      case "proj":
        art = `<line x1="35" y1="164" x2="485" y2="164" stroke="#64748b" stroke-width="3"/>
          <path d="M55 140 Q180 -10 400 164" fill="none" stroke="#2563eb" stroke-width="3"/>
          <circle cx="55" cy="140" r="7" fill="#f97316"/>
          <line x1="55" y1="140" x2="120" y2="95" stroke="#059669" stroke-width="3" marker-end="url(#arrGreen)"/>
          <text x="78" y="98" font-size="12" fill="#059669" font-weight="700">v₀</text>
          <line x1="55" y1="140" x2="122" y2="140" stroke="#2563eb" stroke-width="2" marker-end="url(#arrBlue)"/>
          <text x="80" y="155" font-size="11" fill="#2563eb">vₓ</text>
          <line x1="430" y1="140" x2="430" y2="164" stroke="#dc2626" stroke-width="2" marker-end="url(#arrRed)"/>
          <text x="442" y="151" font-size="11" fill="#dc2626">g</text>
          <text x="260" y="43" text-anchor="middle" fill="#1d4ed8" font-size="12" font-weight="700">Quỹ đạo parabol</text>
          <text x="250" y="179" text-anchor="middle" fill="#475569" font-size="11">Tầm xa L</text>`;
        break;
      case "rot": case "circ":
        art = `<circle cx="250" cy="105" r="62" fill="#dbeafe" fill-opacity=".55" stroke="#64748b" stroke-width="2" stroke-dasharray="5 4"/>
          <circle cx="250" cy="105" r="4" fill="#334155"/><text x="239" y="122" font-size="12" fill="#334155">O</text>
          <circle cx="312" cy="105" r="9" fill="#f97316" stroke="#c2410c"/>
          <line x1="250" y1="105" x2="312" y2="105" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrRed)"/>
          <text x="276" y="96" font-size="12" fill="#dc2626" font-weight="700">R</text>
          <line x1="312" y1="105" x2="312" y2="42" stroke="#2563eb" stroke-width="3" marker-end="url(#arrBlue)"/>
          <text x="323" y="54" font-size="12" fill="#2563eb" font-weight="700">v</text>
          <path d="M250 43 A62 62 0 0 1 310 90" fill="none" stroke="#059669" stroke-width="3" marker-end="url(#arrGreen)"/>
          <text x="240" y="24" text-anchor="middle" fill="#1d4ed8" font-size="12" font-weight="700">Chuyển động tròn</text>`;
        break;
      case "vtgraph":
        art = `<line x1="55" y1="164" x2="470" y2="164" stroke="#64748b" stroke-width="2"/>
          <line x1="55" y1="164" x2="55" y2="38" stroke="#64748b" stroke-width="2"/>
          <path d="M55 145 L420 55" fill="none" stroke="#2563eb" stroke-width="3"/>
          <circle cx="55" cy="145" r="4" fill="#2563eb"/><circle cx="420" cy="55" r="4" fill="#2563eb"/>
          <text x="476" y="168" fill="#475569" font-size="12">t (s)</text><text x="43" y="31" fill="#475569" font-size="12">v (m/s)</text>
          <text x="275" y="43" fill="#2563eb" font-size="12" font-weight="700">Độ dốc = gia tốc</text>`;
        break;
      default:
        art = `<line x1="40" y1="164" x2="480" y2="164" stroke="#64748b" stroke-width="3"/>
          <rect x="100" y="105" width="70" height="50" rx="8" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/>
          <text x="135" y="135" text-anchor="middle" fill="#1e40af" font-size="13" font-weight="700">Vật</text>
          <line x1="170" y1="118" x2="280" y2="118" stroke="#2563eb" stroke-width="3" marker-end="url(#arrBlue)"/>
          <text x="220" y="105" text-anchor="middle" fill="#2563eb" font-size="12" font-weight="700">v</text>
          ${q.fig==="acc+" ? `<line x1="170" y1="145" x2="245" y2="145" stroke="#059669" stroke-width="3" marker-end="url(#arrGreen)"/><text x="208" y="158" fill="#059669" font-size="11">a cùng chiều v</text>` : ""}
          ${q.fig==="acc-" ? `<line x1="100" y1="145" x2="45" y2="145" stroke="#dc2626" stroke-width="3" marker-end="url(#arrRed)"/><text x="47" y="132" fill="#dc2626" font-size="11">a</text>` : ""}
          <text x="260" y="47" text-anchor="middle" fill="#1d4ed8" font-size="12" font-weight="700">Chuyển động thẳng trên trục Ox</text>
          <line x1="65" y1="174" x2="450" y2="174" stroke="#94a3b8" stroke-width="1.5"/><text x="458" y="179" fill="#64748b" font-size="11">+Ox</text>`;
    }
    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 222" role="img" aria-label="Hình minh họa câu ${index+1}">
      ${ARROWS}<rect x="1" y="1" width="518" height="220" rx="12" fill="#f8fafc" stroke="#dbe3ee"/>
      <text x="16" y="20" fill="#1e40af" font-size="11" font-weight="700">SƠ ĐỒ VẬT LÝ · CÂU ${index+1}</text>
      ${art}<line x1="16" y1="184" x2="504" y2="184" stroke="#cbd5e1" stroke-width="1"/>${chips}
      ${labels.length===0 ? `<text x="260" y="204" text-anchor="middle" fill="#475569" font-size="11">Sơ đồ khái niệm</text>` : ""}
    </svg>`;
}

let curr = 0;
let score = 0;
let answered = new Array(questions.length).fill(false);
let chosen = new Array(questions.length).fill(null);
const $ = document.getElementById('quiz-container');

function initJumpSelect() {
    const select = document.getElementById("question-select");
    select.innerHTML = "";
    questions.forEach((q, index) => {
        const opt = document.createElement("option");
        opt.value = index;
        opt.textContent = `Câu ${index + 1}`;
        select.appendChild(opt);
    });
}

function renderQ() {
    const q = questions[curr];
    let html = `
        <div class="meta">
            <span>📝 Câu ${curr + 1} / ${questions.length}</span>
            <span>Điểm: ${score} / ${questions.length * 10}</span>
        </div>
        <div class="q">${q.q}</div>
        <div class="fig">${getFigure(q, curr)}</div>
    `;
    q.o.forEach((opt, idx) => {
        const isOk = idx === q.a;
        const statusClass = answered[curr] ? (isOk ? "ok" : (idx === chosen[curr] ? "no" : "")) : "";
        html += `<button class="opt ${statusClass}" onclick="checkAns(${idx})" ${answered[curr] ? 'disabled' : ''}>
                    <span class="l">${['A','B','C','D'][idx]}</span><span>${opt}</span>
                 </button>`;
    });
    html += `<div class="exp ${answered[curr] ? 'on' : ''}">
        <h3>💡 Lời Giải Chi Tiết:</h3><p>${q.ex}</p>
    </div>`;
    $.innerHTML = html;
    if (window.MathJax) MathJax.typesetPromise();
    document.getElementById('btn-prev').disabled = curr === 0;
    document.getElementById('btn-next').disabled = curr === questions.length - 1;
    document.getElementById('question-select').value = curr;
}

function checkAns(idx) {
    if (answered[curr]) return;
    answered[curr] = true;
    chosen[curr] = idx;
    if (idx === questions[curr].a) score += 10;
    renderQ();
}
function nextQ() { if (curr < questions.length - 1) { curr++; renderQ(); } }
function prevQ() { if (curr > 0) { curr--; renderQ(); } }
function jumpToQuestion(index) { curr = Number(index); renderQ(); }

// Khởi tạo menu câu hỏi và hiển thị câu đầu tiên
initJumpSelect();
renderQ();
</script>
