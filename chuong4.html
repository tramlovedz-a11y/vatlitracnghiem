  {"id": 197, "question": "Trong va chạm đàn hồi, xuyên tâm giữa hai quả cầu giống hệt nhau về kích thước và khối lượng. Chỉ ra trường hợp sẽ xảy ra ngay sau va chạm nếu lúc đầu có một quả cầu đứng yên?", "type": "mc", "options": ["Sẽ có một quả cầu đứng yên.", "Hai quả cầu chuyển động ngược chiều.", "Hai quả cầu chuyển động theo hai hướng vuông góc nhau.", "Hai quả cầu chuyển động cùng chiều."], "answer": 0, "explanation": "Va chạm đàn hồi xuyên tâm giữa hai vật có cùng khối lượng, một vật ban đầu đứng yên: hai vật trao đổi vận tốc; vật thứ nhất dừng lại. Chọn A.", "status": "verified", "note": "Đối chiếu với nội dung gốc; xem lời giải để biết điều kiện áp dụng."}, 
  {"id": 198, "question": "Một vật khối lượng m1 đang chuyển động thẳng hướng từ trái sang phải với vận tốc v thì va chạm mềm với một vật khác khối lượng m2 đang đứng yên. Chỉ ra hướng và độ lớn của hai vật sau va chạm?", "type": "manual", "options": [], "answer": null, "explanation": "Bảo toàn động lượng theo phương chuyển động: \\( m_1 v_1 = (m_1 + m_2)V \\). Do đó \\( V = \\frac{m_1 v_1}{m_1 + m_2} \\), cùng chiều ban đầu của \\( m_1 \\).", "status": "verified", "note": "Đề PDF không cung cấp rõ phương án lựa chọn cho câu này; không tự tạo phương án."}, 
  {"id": 199, "question": "Chỉ ra đơn vị của động lượng?", "type": "mc", "options": ["N/s.", "N.s .", "N.m.", "N.m/s."], "answer": 1, "explanation": "Đơn vị động lượng \\( p = mv \\) là kg·m/s, tương đương N·s. Chọn B.", "status": "verified", "note": "Đối chiếu với nội dung gốc; xem lời giải để biết điều kiện áp dụng."}, 
  {"id": 200, "question": "Chỉ ra định luật mà chuyển động bằng phản lực tuân theo?", "type": "manual", "options": [], "answer": null, "explanation": "Chuyển động bằng phản lực tuân theo định luật bảo toàn động lượng (khi xét hệ kín, ví dụ tên lửa và khí phụt).", "status": "verified", "note": "Đề PDF không cung cấp rõ phương án lựa chọn cho câu này; không tự tạo phương án."}, 
  {"id": 201, "question": "Một quả bóng đập vào bức tường rồi nả ra theo phương đối xứng với phương ban đầu qua pháp tuyến với mặt bức tường. Biết rằng tốc độ bóng nảy ra bằng tốc độ bóng đập vào. Chỉ ra va chạm đó thuộc loại va chạm nào?", "type": "manual", "options": [], "answer": null, "explanation": "Tốc độ trước và sau bằng nhau nhưng hướng thành phần pháp tuyến đổi dấu; nếu tường đứng yên và bỏ qua hao hụt, đây là va chạm đàn hồi.", "status": "verified", "note": "Đề PDF không cung cấp rõ phương án lựa chọn cho câu này; không tự tạo phương án."}, 
  {"id": 202, "question": "Gọi M và m là khối lượng súng và đạn. Vận tốc đạn khi thoát khỏi nòng súng là V. Coi hệ súng và đạn là hệ kín. Chỉ ra công thức vận tốc súng v?", "type": "manual", "options": [], "answer": null, "explanation": "Ban đầu hệ súng–đạn đứng yên nên \\( M\\vec{v}_{súng} + m\\vec{V}_{đạn} = 0 \\). Vì vậy \\( \\vec{v}_{súng} = -\\frac{m}{M}\\vec{V}_{đạn} \\) (nếu V là vận tốc đạn so với đất và khối lượng súng M).", "status": "verified", "note": "Đề PDF không cung cấp rõ phương án lựa chọn cho câu này; không tự tạo phương án."}, 
  {"id": 203, "question": "Viên bi 1 có khối lượng 200 g bay với vận tốc 20m/s tới va chạm đàn hồi xuyên tâm với viên bi 2 nặng 300 g đang đứng yên. Xác định giá trị vận tốc viên bi 1 sau va chạm?", "type": "manual", "options": [], "answer": null, "explanation": "Va chạm đàn hồi xuyên tâm: \\( v_1' = \\frac{m_1 - m_2}{m_1 + m_2} u_1 \\). Thay \\( m_1 = 0,2 \\) kg, \\( m_2 = 0,3 \\) kg, \\( u_1 = 20 \\) m/s: \\( v_1' = \\frac{-0,1}{0,5} \\times 20 = -4 \\) m/s; dấu âm nghĩa là bật ngược.", "status": "verified", "note": "Đề PDF không cung cấp rõ phương án lựa chọn cho câu này; không tự tạo phương án.", "target": -4, "tolerance": 0}, 
  {"id": 204, "question": "Một con lắc đơn gồm một quả cầu khối lượng 400g được treo bởi một sợi dây dài 1,2m, ban đầu vật ở vị trí dây treo lệch với phương thẳng đứng góc 30o. Thả cho vật chuyển động. Xác định độ lớn vận tốc của vật tại vị trí thấp nhất?", "type": "manual", "options": [], "answer": null, "explanation": "Bảo toàn cơ năng: \\( mgh = \\frac{1}{2}mv^2 \\) với \\( h = L(1 - \\cos 30^\\circ) = 1,2(1 - \\sqrt{3}/2) \\approx 0,1608 \\) m. Nếu lấy \\( g = 9,8 \\) m/s² thì \\( v = \\sqrt{2gh} \\approx 1,78 \\) m/s; nếu \\( g = 10 \\) thì \\( \\approx 1,79 \\) m/s.", "status": "conditional", "note": "Đề PDF không cung cấp rõ phương án lựa chọn cho câu này; không tự tạo phương án.", "target": [1.78, 1.79], "tolerance": 0.02}, 
  {"id": 205, "question": "Một vật có khối lượng 4kg rơi tự do không vận tốc đầu trong khoảng thời gian 2,5s. Xác định độ lớn độ biến thiên động lượng của vật trong khoảng thời gian đó?", "type": "manual", "options": [], "answer": null, "explanation": "Độ biến thiên động lượng \\( \\Delta p = m\\Delta v \\). Rơi tự do từ nghỉ trong 2,5 s: \\( \\Delta v = gt \\), nên \\( |\\Delta p| = mgt = 4 \\times g \\times 2,5 \\). Với \\( g = 9,8 \\) m/s²: 98 kg·m/s; với \\( g = 10 \\): 100 kg·m/s.", "status": "conditional", "note": "Đề PDF không cung cấp rõ phương án lựa chọn cho câu này; không tự tạo phương án.", "target": [98, 100], "tolerance": 1}, 
  {"id": 206, "question": "Một quả cầu chuyển động với vận tốc v = 4m/s đến va chạm xuyên tâm với một quả cầu khác cùng khối lượng, đang đứng yên. Biết sau va chạm hai quả cầu dính vào nhau và phần cơ năng mất mát là 12J. Xác định khối lượng các quả cầu?", "type": "manual", "options": [], "answer": null, "explanation": "Va chạm mềm hai khối lượng bằng nhau: vận tốc chung \\( V = 4/2 = 2 \\) m/s. Động năng ban đầu là \\( \\frac{1}{2}m(4^2) = 8m \\); sau va chạm là \\( \\frac{1}{2}(2m)(2^2) = 4m \\), phần mất \\( 4m = 12 \\) J nên \\( m = 3 \\) kg mỗi quả cầu.", "status": "verified", "note": "Đề PDF không cung cấp rõ phương án lựa chọn cho câu này; không tự tạo phương án.", "target": 3, "tolerance": 0}, 
  {"id": 207, "question": "Một viên đạn khối lượng 2 kg bay với tốc độ 100 m/s đến cắm vào một toa xe chở cát có khối lượng 1 tấn đang chuyển động với tốc độ 1,5m/s. Xác định độ lớn nhiệt lượng tỏa ra trong trường hợp xe đi ngược chiều với đạn?", "type": "manual", "options": [], "answer": null, "explanation": "Dùng bảo toàn động lượng để tìm vận tốc chung sau khi đạn cắm vào toa; nhiệt lượng tỏa ra bằng độ giảm động năng \\( K_i - K_f \\). Cần quy ước chiều: đề nói xe đi ngược chiều đạn, nên lấy hai vận tốc trái dấu. Kết quả phụ thuộc cách hiểu tốc độ 1,5 m/s là tốc độ ban đầu của toa.", "status": "review", "note": "Đề PDF không cung cấp rõ phương án lựa chọn cho câu này; không tự tạo phương án."}, 
  {"id": 208, "question": "Một vật khối lượng m’ = 75g rơi tự do xuống đĩa cân lò xo có khối lượng m = 25g từ độ cao h = 20cm so với mặt đĩa cân. Coi va chạm là hoàn toàn không đàn hồi và ảnh hưởng của lực đàn hồi trong quá trình va chạm là rất nhỏ, lấy g = 10m/s². Xác định vận tốc của đĩa cân ngay sau va chạm?", "type": "manual", "options": [], "answer": null, "explanation": "Vận tốc vật rơi ngay trước va chạm \\( v = \\sqrt{2gh} = \\sqrt{2 \\times 10 \\times 0,20} = 2 \\) m/s. Va chạm mềm với đĩa đứng yên: \\( m'v = (m' + m)V \\), \\( V = 0,075 \\times 2 / (0,075 + 0,025) = 1,5 \\) m/s hướng xuống.", "status": "verified", "note": "Đề PDF không cung cấp rõ phương án lựa chọn cho câu này; không tự tạo phương án.", "target": 1.5, "tolerance": 0.05}, 
  {"id": 209, "question": "Một vật khối lượng m1 chuyển động đến va chạm đàn hồi với vật m2=1kg đang đứng yên. Biết rằng sau va chạm, vật m1 đã truyền cho m2 36% động năng ban đầu của mình. Xác định khối lượng m1?", "type": "manual", "options": [], "answer": null, "explanation": "Va chạm đàn hồi xuyên tâm với \\( m_2 \\) đứng yên: phần động năng truyền sang \\( m_2 \\) bằng \\( \\frac{4m_1 m_2}{(m_1 + m_2)^2} \\). Đặt bằng 0,36, \\( m_2 = 1 \\) kg: \\( \\frac{4m_1}{(m_1 + 1)^2} = 0,36 \\), cho \\( m_1 \\approx 0,111 \\) kg hoặc 9 kg. Hai nghiệm đối xứng; đề thiếu điều kiện để chọn một nghiệm.", "status": "review", "note": "Đề PDF không cung cấp rõ phương án lựa chọn cho câu này; không tự tạo phương án."}, 
  {"id": 210, "question": "Hai vật m1=400g và m2=300g, chuyển động với cùng vận tốc 10m/s theo phương vuông góc với nhau. Xác định tổng động lượng của hệ?", "type": "manual", "options": [], "answer": null, "explanation": "Hai vectơ động lượng vuông góc: \\( p = \\sqrt{(m_1 v)^2 + (m_2 v)^2} = 10\\sqrt{0,4^2 + 0,3^2} = 5 \\) kg·m/s.", "status": "verified", "note": "Đề PDF không cung cấp rõ phương án lựa chọn cho câu này; không tự tạo phương án.", "target": 5, "tolerance": 0}, 
  {"id": 211, "question": "Hệ gồm hai vật 1 và 2 có khối lượng và tốc độ lần lượt là 2 kg; 3 m/s và 0,5 kg; 12 m/s. Biết hai vật chuyển động theo hướng ngược nhau. Xác định giá trị tổng động lượng của hệ này?", "type": "manual", "options": [], "answer": null, "explanation": "Chọn chiều vật 1 dương: \\( p_{net} = m_1 v_1 - m_2 v_2 = 2 \\times 3 - 0,5 \\times 12 = 0 \\) kg·m/s. Tổng động lượng bằng 0.", "status": "verified", "note": "Đề PDF không cung cấp rõ phương án lựa chọn cho câu này; không tự tạo phương án.", "target": 0, "tolerance": 0}, 
  {"id": 212, "question": "Một người khối lượng m1=60kg đứng trên một xe goòng khối lượng m2=140kg đang chuyển động trên đường ray với vận tốc V=3m/s, nhảy xuống đất với vận tốc v0=2m/s đối với xe, cùng chiều chuyển động của xe. Bỏ qua mọi lực cản. Xác định độ lớn vận tốc của xe ngay sau khi người đó nhảy?", "type": "manual", "options": [], "answer": null, "explanation": "Gọi chiều ban đầu của xe là dương. Bảo toàn động lượng: \\( (m_1 + m_2)V = m_1 v_{người} + m_2 v_{xe}' \\). Vận tốc người so với đất bằng \\( v_{xe}' + 2 \\) m/s (nhảy cùng chiều so với xe), nên \\( 200 \\times 3 = 60(v_{xe}' + 2) + 140v_{xe}' \\). Suy ra \\( v_{xe}' = 2,4 \\) m/s.", "status": "conditional", "note": "Đề PDF không cung cấp rõ phương án lựa chọn cho câu này; không tự tạo phương án.", "target": 2.4, "tolerance": 0.05}, 
  {"id": 213, "question": "Viên bi 1 có khối lượng 500g chuyển động với vận tốc bằng 10m/s đến va chạm hoàn toàn không đàn hồi với viên bi 2 khối lượng 600g chuyển động cùng chiều với vận tốc 7m/s. Xác định phần trăm năng lượng đã mất mát so với ban đầu?", "type": "manual", "options": [], "answer": null, "explanation": "Va chạm mềm cùng chiều: \\( V = \\frac{0,5 \\times 10 + 0,6 \\times 7}{1,1} = 8,3636 \\) m/s. Tỉ lệ mất động năng = \\( 1 - K_f / K_i \\); \\( K_i = \\frac{1}{2} \\times 0,5 \\times 10^2 + \\frac{1}{2} \\times 0,6 \\times 7^2 = 39,7 \\) J; \\( K_f = \\frac{1}{2} \\times 1,1 \\times V^2 \\approx 38,46 \\) J, mất \\( \\approx 3,1\\% \\).", "status": "verified", "note": "Đề PDF không cung cấp rõ phương án lựa chọn cho câu này; không tự tạo phương án.", "target": 3.1, "tolerance": 0.2}, 
  {"id": 214, "question": "Quả bóng khối lượng 2,5kg chuyển động với vận tốc 10 m/s đến đập vào bức tường rồi nảy ra với vận tốc 8 m/s. Xác định độ giảm cơ năng của quả bóng trong va chạm đó?", "type": "manual", "options": [], "answer": null, "explanation": "Độ giảm động năng: \\( \\Delta K = \\frac{1}{2}m(v_i^2 - v_f^2) = \\frac{1}{2} \\times 2,5 \\times (10^2 - 8^2) = 45 \\) J. Giả sử khối lượng và các tốc độ được nêu là trước/sau va chạm.", "status": "verified", "note": "Đề PDF không cung cấp rõ phương án lựa chọn cho câu này; không tự tạo phương án.", "target": 45, "tolerance": 0}, 
  {"id": 215, "question": "Một vật có khối lượng m chuyển động với vận tốc 3 m/s đến va chạm xuyên tâm với một vật có khối lượng 2m đang đứng yên. Coi va chạm giữa hai vật là mềm. Xác định độ lớn vận tốc hai vật ngay sau va chạm?", "type": "manual", "options": [], "answer": null, "explanation": "Va chạm mềm: \\( mv_1 + 2m \\times 0 = (3m)V \\implies V = 3/3 = 1 \\) m/s.", "status": "verified", "note": "Đề PDF không cung cấp rõ phương án lựa chọn cho câu này; không tự tạo phương án.", "target": 1, "tolerance": 0}, 
  {"id": 216, "question": "Viên bi 1 có khối lượng 200 g bay với vận tốc 20m/s tới va chạm đàn hồi xuyên tâm với viên bi 2 nặng 300 g đang đứng yên. Xác định vận tốc 2 viên bi sau va chạm?", "type": "manual", "options": [], "answer": null, "explanation": "Va chạm đàn hồi xuyên tâm: \\( v_1' = \\frac{m_1 - m_2}{m_1 + m_2} u_1 = \\frac{0,2 - 0,3}{0,5} \\times 20 = -4 \\) m/s; \\( v_2' = \\frac{2m_1}{m_1 + m_2} u_1 = \\frac{0,4}{0,5} \\times 20 = 16 \\) m/s.", "status": "verified", "note": "Đề PDF không cung cấp rõ phương án lựa chọn cho câu này; không tự tạo phương án."}, 
  {"id": 217, "question": "Viên bi 1 có khối lượng 200g bay với vận tốc 20m/s tới va chạm mềm với viên bi 2 nặng 300g đang chuyển động ngược chiều với tốc độ 10m/s. Xác định vận tốc hai vật sau va chạm?", "type": "manual", "options": [], "answer": null, "explanation": "Chọn chiều ban đầu của viên bi 1 dương. \\( V = \\frac{0,2 \\times 20 + 0,3 \\times (-10)}{0,5} = 5 \\) m/s. Hai vật dính nhau nên cùng chuyển động theo chiều ban đầu của bi 1.", "status": "verified", "note": "Đề PDF không cung cấp rõ phương án lựa chọn cho câu này; không tự tạo phương án.", "target": 5, "tolerance": 0}, 
  {"id": 218, "question": "Một con lắc đơn gồm một quả cầu khối lượng 0,5kg được treo bởi một sợi dây dài 2m, ban đầu vật ở vị trí A nằm ngang so với điểm treo. Thả vật không vận tốc ban đầu, khi đến vị trí dây treo thẳng đứng B thì va chạm hoàn toàn đàn hồi với khối hộp nặng 2,5kg, đang đứng yên trên mặt sàn. Xác định tốc độ vật 2 ngay sau va chạm?", "type": "manual", "options": [], "answer": null, "explanation": "Quả cầu thả từ vị trí ngang \\( h = L = 2 \\) m nên vận tốc tại đáy \\( v_1 = \\sqrt{2gL} \\). Với \\( g = 9,8 \\), \\( v_1 \\approx 6,26 \\) m/s. Va chạm đàn hồi xuyên tâm với \\( m_1 = 0,5 \\) kg, \\( m_2 = 2,5 \\) kg đứng yên: \\( v_2' = \\frac{2m_1}{m_1 + m_2} v_1 = 0,3125 v_1 \\approx 1,96 \\) m/s. Nếu lấy \\( g = 10 \\) thì \\( \\approx 2,0 \\) m/s.", "status": "conditional", "note": "Đề PDF không cung cấp rõ phương án lựa chọn cho câu này; không tự tạo phương án.", "target": [1.96, 2.0], "tolerance": 0.05}, 
  {"id": 219, "question": "Một túi cát có khối lượng M = 5kg được treo vào điểm O và ban đầu đứng yên. Ta bắn theo phương nằm ngang một viên đạn có khối lượng m = 10g vào túi cát với vận tốc v = 400m/s và sau đó đạn nằm yên trong túi cát. Xác định phần trăm động năng đã chuyển thành nhiệt so với tổng động năng của hệ ban đầu?", "type": "manual", "options": [], "answer": null, "explanation": "Đạn cắm vào bao cát: \\( V = \\frac{mv}{M + m} = \\frac{0,01 \\times 400}{5,01} \\approx 0,798 \\) m/s. Tỉ lệ động năng còn lại \\( K_f / K_i = \\frac{m}{M + m} \\approx 0,001996 \\); phần chuyển thành nhiệt \\( \\approx 99,80\\% \\). Hiểu “l0g” là 10 g.", "status": "conditional", "note": "Đề PDF không cung cấp rõ phương án lựa chọn cho câu này; không tự tạo phương án.", "target": 99.8, "tolerance": 0.1}, 
  {"id": 220, "question": "Một tên lửa khối lượng tổng cộng m = 1 tấn đang chuyển động theo phương ngang với vận tốc v = 200 m/s thì động cơ hoạt động. Từ trong tên lửa, một lượng nhiên liệu khối lượng m1 = 100 kg cháy và phụt tức thời ra phía sau với vận tốc v1= 700 m/s so với mặt đất. Xác định vận tốc của tên lửa ngay sau đó?", "type": "manual", "options": [], "answer": null, "explanation": "Bảo toàn động lượng theo phương ngang: khối lượng còn lại 900 kg. Với vận tốc nhiên liệu \\( v_1 = 700 \\) m/s so với mặt đất hướng ngược chiều ban đầu, \\( 1000 \\times 200 = 900V - 100 \\times 700 \\), suy ra \\( V \\approx 277,8 \\) m/s. Cách diễn đạt “phụt ra phía sau” và vận tốc so với mặt đất được hiểu theo hướng ngược chiều.", "status": "conditional", "note": "Đề PDF không cung cấp rõ phương án lựa chọn cho câu này; không tự tạo phương án.", "target": 277.8, "tolerance": 1}, 
  {"id": 221, "question": "Một chiếc xe khối lượng 10kg đang đỗ trên mặt sàn nhẵn. Tác dụng vào xe một lực bằng 90N trong khoảng thời gian 3s. Xác định độ biến thiên vận tốc của xe trong khoảng thời gian này bằng bao nhiêu?", "type": "manual", "options": [], "answer": null, "explanation": "Xung lượng lực \\( F\\Delta t = m\\Delta v \\implies \\Delta v = \\frac{90 \\times 3}{10} = 27 \\) m/s.", "status": "verified", "note": "Đề PDF không cung cấp rõ phương án lựa chọn cho câu này; không tự tạo phương án.", "target": 27, "tolerance": 0}, 
  {"id": 222, "question": "Bắn một vật có khối lượng m = 1 kg với vận tốc 4 m/s đến va chạm vào một vật đứng yên có cùng khối lượng đặt trên mặt phẳng nằm ngang có hệ số ma sát 0,1. Coi va chạm là xuyên tâm và không đàn hồi. Xác định quãng đường hệ đi được đến khi dừng lại?", "type": "manual", "options": [], "answer": null, "explanation": "Sau va chạm mềm, \\( V = \\frac{mv}{2m} = 2 \\) m/s. Trượt trên mặt phẳng ngang với ma sát \\( \\mu = 0,1 \\), gia tốc hãm \\( \\mu g \\); quãng đường dừng \\( s = \\frac{V^2}{2\\mu g} = \\frac{4}{2 \\times 0,1 \\times 9,8} \\approx 2,04 \\) m (g=10 cho 2,0 m).", "status": "conditional", "note": "Đề PDF không cung cấp rõ phương án lựa chọn cho câu này; không tự tạo phương án.", "target": [2.0, 2.04], "tolerance": 0.05}, 
  {"id": 223, "question": "Một vật nhỏ khối lượng 3kg trượt xuống một đường dốc thẳng, nhẵn. Tại một thời điểm t vật có vận tốc 5 m/s, sau đó 4s có vận tốc 8m/s. Xác định động lượng của vật tại thời điểm tiếp sau đó 3s?", "type": "manual", "options": [], "answer": null, "explanation": "Gia tốc dọc dốc \\( a = \\frac{8 - 5}{4} = 0,75 \\) m/s². Sau thêm 3 s, \\( v = 8 + 0,75 \\times 3 = 10,25 \\) m/s. Động lượng \\( p = mv = 3 \\times 10,25 = 30,75 \\) kg·m/s.", "status": "verified", "note": "Đề PDF không cung cấp rõ phương án lựa chọn cho câu này; không tự tạo phương án.", "target": 30.75, "tolerance": 0.1}, 
  {"id": 224, "question": "Một con lắc đơn gồm một quả cầu khối lượng 1,5kg được treo bởi một sợi dây dài 2m, ban đầu vật ở vị trí nằm ngang so với điểm treo. Thả vật không vận tốc ban đầu, khi đến vị trí dây treo thẳng đứng thì va chạm hoàn toàn đàn hồi với vật 2 nặng 4,5kg, đang đứng yên trên mặt sàn. Tính toán độ cao cực đại của quả cầu đạt được sau va chạm?", "type": "manual", "options": [], "answer": null, "explanation": "Quả cầu thả từ ngang, \\( L = 2 \\) m: \\( v_1 = \\sqrt{2gL} \\). Va chạm đàn hồi với vật đứng yên, \\( m_1 = 1,5 \\) kg, \\( m_2 = 4,5 \\) kg: \\( v_1' = \\frac{m_1 - m_2}{m_1 + m_2} v_1 = -0,5 v_1 \\). Độ cao sau va chạm \\( h' = \\frac{v_1'^2}{2g} = 0,25L = 0,50 \\) m.", "status": "verified", "note": "Đề PDF không cung cấp rõ phương án lựa chọn cho câu này; không tự tạo phương án.", "target": 0.5, "tolerance": 0.02}, 
  {"id": 225, "question": "Bắn một viên đạn khối lượng 50g, vận tốc 500m/s găm vào khối gỗ nặng 5kg đang đứng yên trên mặt phẳng ngang. Sau va chạm hai vật đi được quãng đường s= 5m thì dừng lại. Tính toán hệ số ma sát giữa khối gỗ và mặt phẳng ngang?", "type": "manual", "options": [], "answer": null, "explanation": "Sau va chạm mềm, \\( V = \\frac{mv}{m + M} = \\frac{0,05 \\times 500}{5,05} \\approx 4,950 \\) m/s. Dừng sau 5 m: \\( V^2 = 2\\mu gs \\implies \\mu = \\frac{V^2}{2gs} \\approx \\frac{24,50}{2 \\times 9,8 \\times 5} = 0,250 \\) (với g=10: 0,245).", "status": "conditional", "note": "Đề PDF không cung cấp rõ phương án lựa chọn cho câu này; không tự tạo phương án.", "target": [0.245, 0.25], "tolerance": 0.01}, 
  {"id": 226, "question": "Bao cát được treo bằng một sợi dây dài, nhẹ. Một viên đạn bay với vận tốc v = 200m/s theo phương ngang đến cắm vào bao cát. Biết khối lượng bao cát là 10 kg, viên đạn là 100g. Lấy g = 10m/s². Tính toán độ cao lớn nhất mà bao cát được nâng lên?", "type": "manual", "options": [], "answer": null, "explanation": "Sau khi đạn cắm vào bao cát, \\( V = \\frac{mv}{M + m} = \\frac{0,1 \\times 200}{10,1} \\approx 1,980 \\) m/s. Đổi động năng thành thế năng: \\( h = \\frac{V^2}{2g} \\approx 0,196 \\) m (g=10).", "status": "verified", "note": "Đề PDF không cung cấp rõ phương án lựa chọn cho câu này; không tự tạo phương án.", "target": 0.196, "tolerance": 0.01}, 
  {"id": 227, "question": "Người ta dùng một búa máy có trọng lượng 1000N để đóng một cái cọc có trọng lượng 200N vào đất. Mỗi lần đóng, cọc lún sâu thêm một đoạn 20cm. Tính toán lực cản trung bình của đất, biết búa rơi từ độ cao 5m so với đầu cọc? Coi va chạm giữa búa và cọc là hoàn toàn không đàn hồi.", "type": "manual", "options": [], "answer": null, "explanation": "Búa nặng 1000 N rơi 5 m: động năng trước va chạm \\( K = 1000 \\times 5 = 5000 \\) J. Va chạm mềm với cọc nặng 200 N; khối lượng tỉ lệ trọng lượng, vận tốc chung sau va chạm có \\( K_{sau} = K_{búa} \\frac{W_{búa}}{W_{búa} + W_{cọc}} = 5000 \\times \\frac{1000}{1200} \\approx 4166,7 \\) J. Khi cọc lún 0,2 m, định lý công–động năng cho lực cản trung bình R: \\( R \\times 0,2 = (W_{búa} + W_{cọc}) \\times 0,2 + K_{sau} \\implies R \\approx (4166,7 / 0,2) + 1200 \\approx 22033 \\) N. Bỏ qua các chi tiết biến dạng/độ cao trong thời gian va chạm.", "status": "review", "note": "Đề PDF không cung cấp rõ phương án lựa chọn cho câu này; không tự tạo phương án."}, 
  {"id": 228, "question": "Từ điểm A có độ cao h = 5m (hình 4.2.5), người ta thả một vật có khối lượng m1 = 4kg có thể trượt không ma sát trên đường cong AB. Tại điểm B nó va chạm hoàn toàn đàn hồi với một vật đang đứng yên có khối lượng m2 = 6kg. Cho g = 10m/s2. Tính toán độ cao cực đại mà vật m1 đạt được sau va chạm?", "type": "manual", "options": [], "answer": null, "explanation": "Vật 1 trượt từ cao 5 m không ma sát nên \\( v_1 = \\sqrt{2gh} = 10 \\) m/s (g=10). Va chạm đàn hồi với \\( m_2 \\) đứng yên: \\( v_1' = \\frac{m_1 - m_2}{m_1 + m_2} v_1 = \\frac{4 - 6}{10} \\times 10 = -2 \\) m/s. Độ cao cực đại \\( h' = \\frac{v_1'^2}{2g} = 0,20 \\) m.", "status": "verified", "note": "Đề PDF không cung cấp rõ phương án lựa chọn cho câu này; không tự tạo phương án.", "target": 0.2, "tolerance": 0.01}, 
  {"id": 229, "question": "Một búa máy khối lượng 900 kg rơi từ độ cao 2 m vào một cái cọc khối lượng 100 kg. Va chạm giữa búa và cọc là va chạm mềm. Cho g = 10 m/s2. Tính toán động năng của hệ (búa + cọc) sau va chạm?", "type": "manual", "options": [], "answer": null, "explanation": "Búa rơi từ nghỉ: \\( v = \\sqrt{2gh} = \\sqrt{40} \\approx 6,325 \\) m/s. Va chạm mềm với cọc đứng yên, vận tốc chung \\( V = \\frac{900}{900 + 100} v = 0,9v \\approx 5,692 \\) m/s. Động năng sau va chạm \\( K = \\frac{1}{2} \\times 1000 \\times V^2 \\approx 16\\,200 \\) J.", "status": "verified", "note": "Đề PDF không cung cấp rõ phương án lựa chọn cho câu này; không tự tạo phương án.", "target": 16200, "tolerance": 10}, 
  {"id": 230, "question": "Một khẩu pháo khối lượng 500kg, nhả đạn khối lượng 10kg theo phương hợp với phương ngang góc 600, đạn rời nòng với tốc độ 300m/s. Tính toán tốc độ của khẩu pháo sẽ chuyển động ngay sau khi bắn biết động lượng của hệ bảo toàn theo phương ngang?", "type": "manual", "options": [], "answer": null, "explanation": "Bảo toàn động lượng theo phương ngang: pháo ban đầu đứng yên, \\( 0 = Mv_p + mv_{đạn} \\cos 60^\\circ \\). Độ lớn \\( v_p = \\frac{10 \\times 300 \\times 0,5}{500} = 3,0 \\) m/s, ngược chiều thành phần ngang của đạn.", "status": "verified", "note": "Đề PDF không cung cấp rõ phương án lựa chọn cho câu này; không tự tạo phương án.", "target": 3.0, "tolerance": 0}, 
  {"id": 231, "question": "Một xe cát có khối lượng 0,8 tấn đang đứng yên trên đường ray nằm ngang. Một viên đạn có khối lượng 5 kg bay với vận tốc 100m/s từ phía sau, đến cắm vào bao cát theo hướng hợp với phương ngang một góc 300. Tính toán vận tốc của toa xe ngay sau đó, biết động lượng của hệ bảo toàn theo phương ngang?", "type": "manual", "options": [], "answer": null, "explanation": "Bảo toàn động lượng theo phương ngang: \\( v_{toa} = \\frac{m v \\cos 30^\\circ}{M + m} = \\frac{5 \\times 100 \\times \\cos 30^\\circ}{800 + 5} \\approx 0,538 \\) m/s theo chiều ngang của đạn.", "status": "verified", "note": "Đề PDF không cung cấp rõ phương án lựa chọn cho câu này; không tự tạo phương án.", "target": 0.538, "tolerance": 0.01}, 
  {"id": 232, "question": "Một quả bóng khối lượng 250 g bay tới đập vuông góc vào tường với tốc độ 5 m/s và bật ngược trở lại với tốc độ 3 m/s. Tính toán động lượng của vật đã thay đổi một lượng bằng?", "type": "manual", "options": [], "answer": null, "explanation": "Chọn chiều hướng vào tường dương: \\( p_i = 0,25 \\times 5 = 1,25 \\); \\( p_f = -0,25 \\times 3 = -0,75 \\) kg·m/s. \\( \\Delta p = p_f - p_i = -2,0 \\) kg·m/s, độ lớn biến thiên là 2,0 kg·m/s.", "status": "verified", "note": "Đề PDF không cung cấp rõ phương án lựa chọn cho câu này; không tự tạo phương án.", "target": 2.0, "tolerance": 0}, 
  {"id": 233, "question": "Một vật khối lượng 1 kg chuyển động tròn đều với tốc độ 10 m/s. Tính toán độ biến thiên động lượng của vật sau 1/4 chu kì kể từ lúc bắt đầu chuyển động bằng?", "type": "manual", "options": [], "answer": null, "explanation": "Sau 1/4 chu kì, vectơ vận tốc đổi hướng 90° nhưng độ lớn vẫn 10 m/s. Độ lớn độ biến thiên động lượng = \\( m\\sqrt{v^2 + v^2} = \\sqrt{2} \\times 10 \\approx 14,14 \\) kg·m/s.", "status": "verified", "note": "Đề PDF không cung cấp rõ phương án lựa chọn cho câu này; không tự tạo phương án.", "target": 14.14, "tolerance": 0.05}, 
  {"id": 234, "question": "Trên mặt phẳng ngang không ma sát xe A chuyển động với vận tốc 5m/s đến va chạm hoàn toàn đàn hồi với xe B có khối lượng 3kg đang đứng yên. Sau va chạm xe A bật lại với vận tốc 100cm/s. Tính toán khối lượng của xe A?", "type": "manual", "options": [], "answer": null, "explanation": "Va chạm đàn hồi một chiều với xe B đứng yên: \\( v_A' = \\frac{m_A - m_B}{m_A + m_B} u_A \\). Với \\( u_A = 5 \\) m/s, \\( v_A' = -1 \\) m/s, \\( m_B = 3 \\) kg: \\( -1 = 5\\frac{m_A - 3}{m_A + 3} \\). Giải ra \\( m_A = 1,5 \\) kg.", "status": "verified", "note": "Đề PDF không cung cấp rõ phương án lựa chọn cho câu này; không tự tạo phương án.", "target": 1.5, "tolerance": 0}, 
  {"id": 235, "question": "Viên đạn chuyển động với vận tốc 300m/s theo phương ngang thì nổ thành 2 mảnh. Mảnh 1 khối lượng 5kg chuyển động với vận tốc 400√3 m/s thẳng đứng lên trên, mảnh thứ 2 có khối lượng 15kg. Tính toán vận tốc của mảnh thứ 2?", "type": "manual", "options": [], "answer": null, "explanation": "Bảo toàn động lượng: ban đầu \\( p = (m_1 + m_2)v_0 = 20 \\times 300 = 6000 \\) kg·m/s theo ngang. Mảnh 1 có \\( m_1 = 5 \\) kg, \\( v_1 = 400\\sqrt{3} \\) m/s thẳng đứng nên \\( p_1 = (0, 2000\\sqrt{3}) \\). Mảnh 2 \\( m_2 = 15 \\) kg có \\( p_2 = (6000, -2000\\sqrt{3}) \\); \\( v_2 = (400, -\\frac{400\\sqrt{3}}{3}) \\) m/s, tốc độ \\( |v_2| \\approx 461,9 \\) m/s.", "status": "verified", "note": "Đề PDF không cung cấp rõ phương án lựa chọn cho câu này; không tự tạo phương án.", "target": 461.9, "tolerance": 0.5}, 
  {"id": 236, "question": "Một viên đạn có khối lượng 12,0g bay theo phương ngang tới xuyên sâu vào khối gỗ khối lượng M=100g đang nằm yên trên mặt phẳng. Sau va chạm đạn và khối gỗ dính vào nhau và trượt một đoạn 8m trước khi dừng lại. Nếu hệ số ma sát giữa khối hộp và mặt phẳng ngang là 0,2. Tính toán vận tốc viên đạn trước khi va chạm?", "type": "manual", "options": [], "answer": null, "explanation": "Sau khi dính nhau, khối lượng tổng 0,112 kg trượt dừng sau 8 m: \\( V^2 = 2\\mu gs = 2 \\times 0,2 \\times 9,8 \\times 8 = 31,36 \\implies V = 5,6 \\) m/s. Bảo toàn động lượng: \\( m_b v_b = (m_b + M)V \\), nên \\( v_b = \\frac{0,112}{0,012} \\times 5,6 \\approx 52,27 \\) m/s.", "status": "conditional", "note": "Đề PDF không cung cấp rõ phương án lựa chọn cho câu này; không tự tạo phương án.", "target": 52.27, "tolerance": 0.5}, 
  {"id": 237, "question": "Một viên đạn khối lượng 5g chuyển động với vận tốc 400m/s thì gặp một cánh cửa thép. Đạn xuyên qua cánh cửa trong thời gian 0,001 s. Sau khi xuyên qua tường vận tốc của đạn còn 200 m/s. Tính toán lực cản trung bình của cửa tác dụng lên đạn có độ lớn bằng bao nhiêu?", "type": "manual", "options": [], "answer": null, "explanation": "Xung lượng: \\( F_{avg} \\Delta t = \\Delta p = m(v_f - v_i) \\). Độ lớn \\( F = \\frac{0,005 \\times |200 - 400|}{0,001} = 1000 \\) N, ngược chiều chuyển động viên đạn.", "status": "verified", "note": "Đề PDF không cung cấp rõ phương án lựa chọn cho câu này; không tự tạo phương án.", "target": 1000, "tolerance": 0}, 
  {"id": 238, "question": "Người ta bắn một viên đạn (hình 4.2.13) có khối lượng m=3g vào trong một khối có khối lượng M = 2kg ban đầu nằm yên trên mép của một cái bàn cao h = 1m. Sau va chạm, viên đạn vẫn còn nằm trong khối và toàn bộ khối có viên đạn rơi cách chân bàn d = 1,5m như hình vẽ. Tính toán vận tốc ban đầu của viên đạn?", "type": "manual", "options": [], "answer": null, "explanation": "Rơi khỏi bàn: thời gian rơi \\( t = \\sqrt{\\frac{2h}{g}} = \\sqrt{\\frac{2}{9,8}} \\approx 0,452 \\) s. Vận tốc ngang ngay sau va chạm của khối+đạn \\( V = \\frac{d}{t} \\approx \\frac{1,5}{0,452} = 3,32 \\) m/s. Bảo toàn động lượng ngang trong va chạm: \\( m v_0 = (M + m)V \\implies v_0 = \\frac{2,003}{0,003} \\times 3,32 \\approx 2218 \\) m/s. Nếu lấy \\( g = 10 \\) thì xấp xỉ 2237 m/s.", "status": "conditional", "note": "Đề PDF không cung cấp rõ phương án lựa chọn cho câu này; không tự tạo phương án.", "target": [2218, 2237], "tolerance": 5},
  {"id": 239, "question": "Một quả cầu khối lượng 0,600 kg được treo bởi một sợi dây dài 80,0 cm. Ban đầu quả cầu được kéo đến vị trí dây treo nằm theo phương ngang và thả không vận tốc ban đầu. Khi đến vị trí dây treo thẳng đứng thì va chạm hoàn toàn đàn hồi với khối hộp có khối lượng 3,0 kg, đang đứng yên trên mặt sàn có hệ số ma sát bằng 0,1. Tính quãng đường mà khối hộp đi được sau va chạm cho tới khi dừng lại?", "type": "manual", "options": [], "answer": null, "explanation": "Bảo toàn cơ năng của quả cầu trước va chạm: \\( mgh = \\frac{1}{2}mv_0^2 \\), với \\( h = L = 0,800 \\) m nên \\( v_0 = \\sqrt{2gL} \\). Với va chạm đàn hồi một chiều và khối hộp ban đầu đứng yên, vận tốc khối hộp ngay sau va chạm là \\( V = \\frac{2m}{m+M}v_0 \\). Lấy \\( g = 9,8 \\) m/s²: \\( v_0 \\approx 3,96 \\) m/s và \\( V \\approx \\frac{1,2}{3,6} \\times 3,96 = 1,32 \\) m/s. Sau va chạm, lực ma sát làm khối hộp dừng lại: \\( \\mu Mg \\times s = \\frac{1}{2}MV^2 \\), suy ra \\( s = \\frac{V^2}{2\\mu g} \\approx 0,889 \\) m. Nếu lấy \\( g = 10 \\) m/s², kết quả xấp xỉ 0,907 m.", "status": "conditional", "note": "Đề không nêu g, nên lời giải ghi cả hai quy ước thường gặp.", "diagram": "impact", "target": [0.889, 0.907], "tolerance": 0.025}
];

const solved=new Set(), attempts={};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let index=0;
function getDiagram(q){
 const id=q.id, tag=q.diagram||'auto';
 const defs=`<defs><marker id="arr" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6z" fill="#2563eb"/></marker><marker id="arr2" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6z" fill="#dc2626"/></marker></defs>`;
 let body='';
 
 if(tag === 'impact'){
   body=`<path d="M24 130H375" stroke="#64748b" stroke-width="3"/><path d="M95 24V55" stroke="#475569" stroke-width="3"/><path d="M95 55L95 66" stroke="#475569" stroke-width="2"/><circle cx="95" cy="80" r="18" fill="#93c5fd" stroke="#1d4ed8" stroke-width="2"/><text x="95" y="84" font-size="11" text-anchor="middle" fill="#1e3a8a">m</text><line x1="95" y1="98" x2="95" y2="127" stroke="#475569" stroke-width="2" stroke-dasharray="4 4"/><rect x="235" y="95" width="58" height="35" rx="4" fill="#fecaca" stroke="#dc2626" stroke-width="2"/><text x="264" y="116" font-size="12" text-anchor="middle" fill="#7f1d1d">M</text><line x1="118" y1="80" x2="220" y2="80" stroke="#2563eb" stroke-width="3" marker-end="url(#arr)"/><text x="169" y="69" font-size="12" fill="#2563eb">v</text><line x1="265" y1="91" x2="333" y2="91" stroke="#059669" stroke-width="3" marker-end="url(#arr2)"/><text x="299" y="78" font-size="12" fill="#059669">V</text><text x="200" y="153" text-anchor="middle" fill="#475569" font-size="12">Va chạm đàn hồi · ma sát làm vật dừng lại</text>`;
 }
 else if(/va chạm|viên bi|quả cầu|đạn|bóng|bao cát|búa|pháo|tên lửa/i.test(q.question)){
   body=`<circle cx="105" cy="82" r="23" fill="#93c5fd" stroke="#1d4ed8" stroke-width="2"/><text x="105" y="87" text-anchor="middle" font-size="13" fill="#1e3a8a">m₁</text><circle cx="295" cy="82" r="23" fill="#fca5a5" stroke="#dc2626" stroke-width="2"/><text x="295" y="87" text-anchor="middle" font-size="13" fill="#7f1d1d">m₂</text><line x1="130" y1="82" x2="190" y2="82" stroke="#2563eb" stroke-width="3" marker-end="url(#arr)"/><line x1="270" y1="82" x2="210" y2="82" stroke="#dc2626" stroke-width="3" marker-end="url(#arr2)"/><text x="160" y="67" fill="#2563eb" font-size="12">v₁</text><text x="230" y="67" fill="#dc2626" font-size="12">v₂</text><text x="200" y="137" text-anchor="middle" fill="#475569" font-size="12">Trước va chạm · bảo toàn động lượng hệ kín</text>`;
 } else if(/động lượng|xung lượng|lực|định luật II/i.test(q.question)){
   body=`<rect x="155" y="55" width="90" height="55" rx="8" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/><text x="200" y="86" text-anchor="middle" fill="#1e3a8a">m, v</text><line x1="245" y1="82" x2="335" y2="82" stroke="#2563eb" stroke-width="4" marker-end="url(#arr)"/><text x="290" y="68" text-anchor="middle" fill="#2563eb" font-size="13">p = mv</text><text x="200" y="140" text-anchor="middle" fill="#475569" font-size="12">J = F Δt = Δp</text>`;
 } else {
   body=`<line x1="35" y1="115" x2="365" y2="115" stroke="#64748b" stroke-width="2"/><line x1="55" y1="115" x2="55" y2="28" stroke="#64748b" stroke-width="2"/><rect x="135" y="67" width="55" height="48" rx="5" fill="#bfdbfe" stroke="#2563eb"/><text x="162" y="95" text-anchor="middle" fill="#1e3a8a">m₁</text><rect x="255" y="67" width="55" height="48" rx="5" fill="#fecaca" stroke="#dc2626"/><text x="282" y="95" text-anchor="middle" fill="#7f1d1d">m₂</text><text x="200" y="145" text-anchor="middle" fill="#475569" font-size="12">Hệ vật · trục tọa độ và vectơ chuyển động</text>`;
 }
 return `<svg viewBox="0 0 400 165" role="img" aria-label="Sơ đồ minh họa câu ${q.id}">${defs}${body}</svg>`;
}
function statusName(s){return s==='verified'?'Đã kiểm chứng':s==='conditional'?'Có giả định':'Cần rà soát';}
function updateSummary(){
 const counts={verified:0,conditional:0,review:0}; questions.forEach(q=>counts[q.status]++);
 document.getElementById('summary').textContent=`Đã mở/chấm đúng ${solved.size}/56 câu. Đang xem câu ${index+1}/56.`;
 document.getElementById('status-counts').innerHTML=`<span>verified: ${counts.verified}</span><span>conditional: ${counts.conditional}</span><span>review: ${counts.review}</span>`;
}
function render(){
 const q=questions[index],content=document.getElementById('question-content');
 document.getElementById('progress-fill').style.width=((index+1)/questions.length*100)+'%';
 let opts='';
 if(q.type==='mc'){
  const chosen=attempts[q.id];
  opts='<div class="options">'+q.options.map((o,i)=>{let cls='opt',disabled=chosen!==undefined?'disabled':'';if(chosen!==undefined&&i===q.answer)cls+=' ok';if(chosen!==undefined&&i===chosen&&chosen!==q.answer)cls+=' no';return `<button class="${cls}" data-opt="${i}" ${disabled}><span class="l">${'ABCD'[i]}</span><span>${esc(o)}</span></button>`;}).join('')+'</div>';
 } else {
  const val=attempts[q.id]!==undefined?attempts[q.id]:'';
  opts=`<label class="hint" for="manual-answer">Nhập kết quả (nếu câu tính toán) hoặc công thức/ý trả lời:</label><div class="manual-area"><input id="manual-answer" class="input-area" placeholder="Nhập câu trả lời của bạn..." value="${esc(val)}" ${attempts[q.id]!==undefined?'disabled':''}><button id="check-manual" class="btn btn-primary" style="flex:0 0 auto" ${attempts[q.id]!==undefined?'disabled':''}>Kiểm tra / Xem lời giải</button></div><p class="note">Hệ thống có hỗ trợ tự động đối chiếu giá trị số học cho nhiều câu tính toán trong hệ thống mới (với dung sai cho phép).</p>`;
 }
 const wasAnswered=attempts[q.id]!==undefined;
 const feedback=wasAnswered?(q.type==='mc'?(attempts[q.id]===q.answer?`Chính xác! Đáp án ${'ABCD'[q.answer]}.`:`Chưa chính xác. Đáp án đúng: ${'ABCD'[q.answer]}.`):'Đã kiểm tra/mở lời giải; xem bên dưới để đối chiếu.') : '';
 const feedbackClass=feedback.startsWith('Chính xác')?'good':feedback.startsWith('Chưa chính xác')?'bad':'neutral';
 content.innerHTML=`<div class="meta"><span>📝 Câu ${index+1} / 56 · Mã câu gốc ${q.id}</span><span>Điểm: ${solved.size} / 56</span></div><div class="q">${q.question}</div><div class="fig">${getDiagram(q)}</div>${opts}<div id="feedback" class="feedback ${feedbackClass}" style="${feedback?'display:block':''}">${esc(feedback)}</div><div id="explanation" class="exp ${wasAnswered?'on':''}"><h3>💡 Lời giải chi tiết</h3><p>${q.explanation}</p><p class="note" style="margin-top:10px"><strong>Trạng thái:</strong> <span class="status-pill ${q.status}">${statusName(q.status)}</span>${q.note?' · '+esc(q.note):''}</p></div>`;
 if(q.type==='mc')content.querySelectorAll('[data-opt]').forEach(b=>b.addEventListener('click',()=>choose(Number(b.dataset.opt))));
 else document.getElementById('check-manual').addEventListener('click',checkManual);
 document.getElementById('btn-prev').disabled=index===0;
 document.getElementById('btn-next').textContent=index===questions.length-1?'Hoàn thành ✓':'Câu Tiếp Theo →';
 document.getElementById('question-select').value=String(index);
 updateSummary();
 if(window.MathJax?.typesetPromise)MathJax.typesetPromise([content]).catch(()=>{});
}
function choose(i){
 const q=questions[index];if(attempts[q.id]!==undefined)return;attempts[q.id]=i;if(i===q.answer)solved.add(q.id);showCurrentFeedback();
}
function parseNum(s){const m=String(s??'').trim().replace(',','.').match(/[-+]?(?:\d+\.?\d*|\.\d+)(?:[eE][-+]?\d+)?/);return m?Number(m[0]):NaN;}
function checkManual(){
 const q=questions[index],value=document.getElementById('manual-answer').value.trim();
 if(!value){alert('Vui lòng nhập đáp án trước khi kiểm tra.');document.getElementById('manual-answer').focus();return;}
 attempts[q.id]=value;
 if(q.target!==undefined){
  const n=parseNum(value),targets=Array.isArray(q.target)?q.target:[q.target],tol=q.tolerance??0.05;
  const ok=Number.isFinite(n)&&targets.some(t=>Math.abs(n-t)<=tol);
  if(ok)solved.add(q.id);else solved.delete(q.id);
  const fb=document.getElementById('feedback');fb.style.display='block';fb.className='feedback '+(ok?'good':'bad');
  fb.textContent=ok?'Kết quả phù hợp với đáp số tham khảo (trong sai số cho phép).':'Kết quả chưa khớp với đáp số tham khảo trong sai số cho phép. Xem công thức, giả định và lời giải bên dưới.';
  document.getElementById('explanation').classList.add('on');
 }else{
  const fb=document.getElementById('feedback');fb.style.display='block';fb.className='feedback neutral';fb.textContent='Đã ghi nhận câu trả lời. Câu này hiện không có đáp án số cứng định sẵn để chấm tự động; hãy đối chiếu công thức/ý trả lời bên dưới.';
  document.getElementById('explanation').classList.add('on');
  solved.add(q.id); // Vẫn đánh dấu là đã hoàn thành
 }
 document.getElementById('manual-answer').disabled = true;
 document.getElementById('check-manual').disabled = true;
 updateSummary();if(window.MathJax?.typesetPromise)MathJax.typesetPromise([document.getElementById('explanation')]).catch(()=>{});
}
function showCurrentFeedback(){
 const q=questions[index],fb=document.getElementById('feedback');fb.style.display='block';fb.className='feedback '+(attempts[q.id]===q.answer?'good':'bad');fb.textContent=attempts[q.id]===q.answer?`Chính xác! Đáp án ${'ABCD'[q.answer]}.`:`Chưa chính xác. Đáp án đúng: ${'ABCD'[q.answer]}.`;
 document.querySelectorAll('[data-opt]').forEach((b,j)=>{b.disabled=true;if(j===q.answer)b.classList.add('ok');if(j===attempts[q.id]&&j!==q.answer)b.classList.add('no');});document.getElementById('explanation').classList.add('on');updateSummary();if(window.MathJax?.typesetPromise)MathJax.typesetPromise([document.getElementById('explanation')]).catch(()=>{});
}
document.getElementById('btn-prev').addEventListener('click',()=>{if(index>0){index--;render();}});
document.getElementById('btn-next').addEventListener('click',()=>{if(index<questions.length-1){index++;render();}else{document.getElementById('summary').textContent=`Đã đến hết 56 câu.`;document.querySelector('.card:last-child').scrollIntoView({behavior:'smooth'});}});
const sel=document.getElementById('question-select');questions.forEach((q,i)=>{const o=document.createElement('option');o.value=i;o.textContent=`Câu ${i+1} · Mã gốc ${q.id}`;sel.appendChild(o);});sel.addEventListener('change',()=>{index=Number(sel.value);render();});
render();
</script>
</body></html>
